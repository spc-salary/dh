<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>دليل مدينة حمص الخدمي والتجاري</title>
  <meta name="description" content="منصة تشاركية مفتوحة لتسجيل الأطباء، المحامين، الصيدليات، والمحلات في حمص" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { fontFamily: { sans: ['Cairo', 'sans-serif'] } } }
    }
  </script>
  <style>
    * { font-family: 'Cairo', sans-serif; box-sizing: border-box; }
    body { background: #e2e8f0 !important; transition: background 0.3s ease; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-thumb { background: rgba(148,163,184,.4); border-radius: 99px; }
    .tab-active   { background:#1d4ed8!important; color:#fff!important; border-color:#1d4ed8!important; box-shadow:0 4px 12px rgba(29,78,216,.25); }
    .subtab-active { background:#1e293b!important; color:#fff!important; }
    
    /* تصميم بطاقات الأقسام الملونة علوياً */
    .card-الطبية { border-top:3px solid #10b981; }
    .card-القانونية { border-top:3px solid #8b5cf6; }
    .card-التسوق { border-top:3px solid #f59e0b; }
    .card-المطاعم { border-top:3px solid #f43f5e; }
    .card-الخدمات { border-top:3px solid #3b82f6; }
    .card-default  { border-top:3px solid #6b7280; }
    
    .badge-الطبية { background:#d1fae5; color:#065f46; }
    .badge-القانونية { background:#ede9fe; color:#4c1d95; }
    .badge-التسوق { background:#fef3c7; color:#78350f; }
    .badge-المطاعم { background:#ffe4e6; color:#9f1239; }
    .badge-الخدمات { background:#dbeafe; color:#1e3a8a; }
    .badge-default  { background:#f3f4f6; color:#374151; }
    
    #toast {
      position:fixed; bottom:1.5rem; left:50%; transform:translateX(-50%);
      padding:.75rem 1.5rem; border-radius:1rem; font-weight:600; font-size:.875rem;
      color:#fff; z-index:9999; display:none; white-space:nowrap;
      box-shadow:0 10px 25px rgba(0,0,0,.2); animation:slideUp .25s ease;
    }
    @keyframes slideUp { from{opacity:0;transform:translateX(-50%) translateY(12px)} to{opacity:1;transform:translateX(-50%) translateY(0)} }
    .skeleton { animation:pulse 1.5s ease-in-out infinite; background:#e5e7eb; border-radius:.5rem; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }
    
    #form-body  { display:none; }
    #form-body.open { display:block; }
    #map-section { display:none; }
    #map-section.open { display:block; }
    #leaflet-map {
      height:260px; width:100%; border-radius:12px; overflow:hidden;
      border:1px solid #e5e7eb; background:#e5e7eb; position:relative; z-index:1;
    }
    .leaflet-pane { z-index:1!important; }
    .leaflet-top, .leaflet-bottom { z-index:2!important; }
    
    #view-map-panel {
      display:none; background:#fff; border-radius:16px;
      border:1px solid #e2e8f0; box-shadow:0 4px 24px rgba(0,0,0,.10);
      overflow:hidden; margin-bottom:8px;
    }
    #view-map-panel.open { display:block; }
    #view-map-panel-header {
      display:flex; align-items:center; justify-content:space-between;
      padding:12px 16px; border-bottom:1px solid #f1f5f9; background:#f8fafc;
    }
    #view-map-title {
      font-size:14px; font-weight:700; color:#1e293b; flex:1;
      text-align:right; overflow:hidden; text-overflow:ellipsis;
      white-space:nowrap; margin-left:8px;
    }
    #close-view-map-btn {
      display:flex; align-items:center; gap:4px; padding:5px 12px;
      border-radius:8px; background:#fee2e2; border:1px solid #fca5a5;
      color:#dc2626; font-size:12px; font-weight:700; cursor:pointer;
      flex-shrink:0; transition:background .15s;
    }
    #close-view-map-btn:hover { background:#fecaca; }
    #view-leaflet-map { display:block; width:100%; height:340px; background:#e5e7eb; }
    #view-map-status {
      padding:6px 16px; font-size:11px; color:#94a3b8; text-align:center;
      font-family:monospace; background:#f8fafc; border-top:1px solid #f1f5f9;
    }
    
    .entry-card { transition:transform .2s ease, box-shadow .2s ease; }
    .entry-card:hover { transform:translateY(-2px); box-shadow:0 12px 24px rgba(0,0,0,.1); }
    .card-details            { display:none; flex-direction:column; gap:4px; padding:10px; border-top:1px solid #f3f4f6; }
    .card-details.open       { display:flex; }
    .card-toggle-bar         { display:flex; align-items:center; justify-content:center; gap:5px; width:100%; padding:8px 10px; background:#f8fafc; border:none; border-top:1px solid #e5e7eb; cursor:pointer; font-size:12px; font-weight:600; color:#3b82f6; transition:background .15s; }
    .card-toggle-bar:hover   { background:#eff6ff; }
    .card-toggle-arrow       { font-size:9px; transition:transform .2s; display:inline-block; }
    
    /* النجوم والتقييم */
    .star-row { display:flex; align-items:center; gap:2px; direction:ltr; }
    .star-btn { background:none; border:none; padding:1px; color:#d1d5db; font-size:16px; }
    .star-btn.filled  { color:#f59e0b; }
    
    /* DARK MODE OVERRIDES */
    .dark-mode { background:#0f172a!important; color:#f1f5f9!important; }
    .dark-mode .bg-white        { background:#1e293b!important; }
    .dark-mode .bg-gray-50      { background:#0f172a!important; }
    .dark-mode .bg-blue-50      { background:rgba(29,78,216,.15)!important; }
    .dark-mode .bg-amber-50     { background:rgba(180,83,9,.15)!important; }
    .dark-mode .text-gray-800   { color:#f1f5f9!important; }
    .dark-mode .text-gray-700   { color:#e2e8f0!important; }
    .dark-mode .text-gray-600   { color:#cbd5e1!important; }
    .dark-mode .text-gray-500   { color:#94a3b8!important; }
    .dark-mode input, .dark-mode select { background:#0f172a!important; border-color:#334155!important; color:#f1f5f9!important; }
    .dark-mode .border-gray-100 { border-color:#334155!important; }
    .dark-mode .border-gray-200 { border-color:#334155!important; }
    .dark-mode .card-toggle-bar { background:#0f172a; border-color:#334155; color:#3b82f6; }
    .dark-mode #view-map-panel  { background:#1e293b; border-color:#334155; }
    .dark-mode #view-map-panel-header { background:#0f172a; border-color:#334155; }
    .dark-mode #view-map-title  { color:#f1f5f9; }
    input[type="search"]::-webkit-search-cancel-button { display:none; }
  </style>
</head>

<body id="body" class="min-h-screen flex flex-col text-gray-800">

<!-- ══════════════ HEADER ══════════════ -->
<header class="relative overflow-hidden">
  <div class="absolute inset-0 bg-gradient-to-l from-blue-900 via-blue-800 to-indigo-900"></div>
  <div class="relative max-w-7xl mx-auto px-4 py-5 sm:py-7">
    <div class="flex flex-col sm:flex-row items-center justify-between gap-4">
      <div class="text-center sm:text-right">
        <div class="flex items-center justify-center sm:justify-start gap-3 mb-1">
          <div class="bg-white/20 rounded-xl p-2">
            <svg class="w-6 h-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a2 2 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
            </svg>
          </div>
          <h1 class="text-2xl sm:text-3xl font-bold text-white">دليل مدينة حمص الخدمي والتجاري</h1>
        </div>
        <p class="text-blue-200 text-sm">منصة تشاركية مفتوحة — أضف طبيبك، محلّك، وخدمتك وشاركها فوراً</p>
      </div>
      <div class="flex items-center gap-2">
        <div class="bg-white/10 border border-white/20 rounded-xl px-3 py-2 text-center hidden sm:block">
          <p class="text-emerald-300 text-xs font-bold">🔒 وضع الحماية (عام)</p>
          <p id="hdr-count" class="text-white/70 text-[10px] mt-0.5">جاري التحميل...</p>
        </div>
        <button onclick="fetchData()" title="تحديث البيانات" class="bg-white/10 hover:bg-white/20 border border-white/20 text-white rounded-xl p-2.5 transition-all">
          <svg id="refresh-icon" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
          </svg>
        </button>
        <button onclick="toggleDark()" title="تبديل المظهر" class="bg-white/10 hover:bg-white/20 border border-white/20 text-white rounded-xl p-2.5 transition-all">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
          </svg>
        </button>
      </div>
    </div>
  </div>
</header>

<!-- ══════════════ MAIN CONTENT ══════════════ -->
<main class="flex-grow max-w-7xl w-full mx-auto px-4 py-6 sm:py-8 space-y-6">

  <div id="error-banner" class="hidden bg-amber-50 border border-amber-200 rounded-xl p-3 text-xs text-amber-800 flex items-center gap-2">
    ⚠️ <span id="error-msg"></span>
  </div>

  <!-- ══ نموذج إضافة منشأة جديدة ══ -->
  <div class="bg-white rounded-2xl border border-gray-100 shadow-sm overflow-hidden">
    <button type="button" onclick="toggleForm()" class="w-full flex items-center justify-between p-5 hover:bg-gray-50 transition-all">
      <div class="flex items-center gap-3">
        <div class="bg-blue-100 text-blue-700 rounded-xl p-2">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v3m0 0v3m0-3h3m-3 0H9m12 0a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
        </div>
        <div class="text-right">
          <p class="font-bold text-gray-800 text-sm">إضافة منشأة / طبيب / مكتب / محل جديد</p>
          <p class="text-xs text-gray-400 mt-0.5">انقر لفتح نموذج الإضافة وإدخال البيانات المعروضة فوراً</p>
        </div>
      </div>
      <svg id="form-chevron" class="w-5 h-5 text-gray-400 transform transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
      </svg>
    </button>

    <div id="form-body">
      <div class="border-t border-gray-100 p-5">
        <form id="dir-form" onsubmit="handleSubmit(event)" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
          <div>
            <label class="block text-xs font-bold text-gray-600 mb-1">الاسم التجاري / اسم المهني *</label>
            <input id="f-name" type="text" required placeholder="مثال: د. أحمد فلان — عيادة الأطفال" class="w-full border border-gray-200 rounded-xl p-2.5 text-sm outline-none focus:ring-2 focus:ring-blue-500" />
          </div>

          <div>
            <label class="block text-xs font-bold text-gray-600 mb-1">القسم الرئيسي *</label>
            <select id="f-main" required class="w-full border border-gray-200 rounded-xl p-2.5 text-sm outline-none focus:ring-2 focus:ring-blue-500">
              <option value="">— اختر القسم الرئيسي —</option>
              <option value="الطبية">الطبية (أطباء، صيادلة، مشافي)</option>
              <option value="القانونية">القانونية (محامون، مكاتب عقارية)</option>
              <option value="التسوق">التسوق (محلات، أسواق)</option>
              <option value="المطاعم">المطاعم (مقاهي، مأكولات)</option>
              <option value="الخدمات">الخدمات (تعليم، صيانة، وظائف)</option>

            <label class="block text-xs font-bold text-gray-600 mb-1">التصنيف الفرعي / الاختصاص *</label>
            <input id="f-sub" type="text" required placeholder="مثال: طب أطفال، صيدلية، محاماة" class="w-full border border-gray-200 rounded-xl p-2.5 text-sm outline-none focus:ring-2 focus:ring-blue-500" />

            <input id="f-notes" type="text" placeholder="مثال: السبت–الأربعاء (4–8 مساءً)" class="w-full border border-gray-200 rounded-xl p-2.5 text-sm outline-none focus:ring-2 focus:ring-blue-500" />

            <div class="flex gap-2">

  <!-- ══ شريط الفرز والبحث ══ -->

      <button onclick="filterCategory('القانونية')" class="tab-btn px-4 py-2 rounded-xl text-xs font-bold border border-gray-200 transition-all bg-white">القانونية 🟣</button>
      <button onclick="filterCategory('التسوق')" class="tab-btn px-4 py-2 rounded-xl text-xs font-bold border border-gray-200 transition-all bg-white">التسوق 🟡</button>
      <button onclick="filterCategory('المطاعم')" class="tab-btn px-4 py-2 rounded-xl text-xs font-bold border border-gray-200 transition-all bg-white">المطاعم 🔴</button>

    <div id="view-map-status">حمص، سوريا</div>

  <!-- ══ شبكة عرض المنشآت ══ -->
  <div id="entries-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
    <!-- السواقط التلقائية (Skeleton Loading) -->
    <div class="skeleton h-48 w-full"></div>
    <div class="skeleton h-48 w-full"></div>
    <div class="skeleton h-48 w-full"></div>
  </div>

</main>

<div id="toast"></div>

<!-- ══════════════ SCRIPTS ══════════════ -->
<script>
  // إعدادات الـ API الخاصة بـ Sheetson
  const API_KEY = 'eNx0s9qu7lEIuykRKQdhjaq6vlt75XAd7d5JJGiTOlvD15vdNndNvEKLiE4';
  const SPREADSHEET_ID = '1H219HS_3WqfGn_mz8sHvtTx0rlKcQtiDgx7G0nzzfNI';
  const SHEET_NAME = 'Sheet1';
  const BASE_URL = 'https://api.sheetson.com/v2/sheets';

  let allEntries = [];
  let currentCategory = 'الكل';
  let map, formMarker;
  let viewMap, viewMarker;

  window.onload = function() {
    // تفعيل الوضع الليلي التلقائي بناء على المفضلة إن وجدت
    if(localStorage.getItem('dark-mode') === 'true') {
      document.documentElement.classList.add('dark');
      document.getElementById('body').classList.add('dark-mode');
    }
    fetchData();
    initFormMap();
  };

  // جلب البيانات بالكامل
  async function fetchData() {
    const refreshIcon = document.getElementById('refresh-icon');
    if(refreshIcon) refreshIcon.classList.add('animate-spin');
    
    try {
      const url = `${BASE_URL}/${SHEET_NAME}?apiKey=${API_KEY}&spreadsheetId=${SPREADSHEET_ID}&limit=100`;
      const response = await fetch(url);
      if (!response.ok) throw new Error(`خطأ في الاتصال بالسيرفر: ${response.status}`);
      
      const data = await response.json();
      allEntries = data.results || []; // معالجة مخرجات Sheetson المعتمدة على الـ results
      
      document.getElementById('hdr-count').innerText = `إجمالي العناصر: ${allEntries.length}`;
      document.getElementById('error-banner').classList.add('hidden');
      renderEntries();
    } catch (error) {
      document.getElementById('error-msg').innerText = "فشل جلب البيانات: " + error.message;
      document.getElementById('error-banner').classList.remove('hidden');
    } finally {
      if(refreshIcon) refreshIcon.classList.remove('animate-spin');
    }
  }

  // تصيير وعرض البطاقات في الصفحة
  function renderEntries() {
    const grid = document.getElementById('entries-grid');
    grid.innerHTML = '';

    const query = document.getElementById('search-input').value.trim().toLowerCase();
    
    const filtered = allEntries.filter(item => {
      const matchesTab = (currentCategory === 'الكل' || item["القسم"] === currentCategory);
      const name = String(item["اسم المكان"] || "").toLowerCase();
      const sub = String(item["الوصف"] || "").toLowerCase();
      const addr = String(item["العنوان بالتفصيل"] || "").toLowerCase();
      const matchesSearch = !query || name.includes(query) || sub.includes(query) || addr.includes(query);
      return matchesTab && matchesSearch;
    });

    if(filtered.length === 0) {
      grid.
