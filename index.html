<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>دليل مدينة حمص الخدمي والتجاري</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV/XN/WLs=" crossorigin=""></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f5f7fa; --surface: #ffffff; --surface2: #f0f4f8; --border: #e2e8f0;
      --text: #1a202c; --text2: #4a5568; --text3: #718096;
      --primary: #2563eb; --primary-hover: #1d4ed8;
      --danger: #ef4444; --success: #10b981;
      --shadow: 0 1px 3px rgba(0,0,0,.1), 0 1px 2px rgba(0,0,0,.06);
      --shadow-lg: 0 10px 15px -3px rgba(0,0,0,.1), 0 4px 6px -2px rgba(0,0,0,.05);
      --radius: 10px;
    }
    body.dark {
      --bg: #0f172a; --surface: #1e293b; --surface2: #0f172a; --border: #334155;
      --text: #f1f5f9; --text2: #cbd5e1; --text3: #94a3b8;
      --shadow: 0 1px 3px rgba(0,0,0,.4);
      --shadow-lg: 0 10px 15px -3px rgba(0,0,0,.4);
    }
    body { font-family: 'Cairo', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; transition: background .2s, color .2s; }

    /* HEADER */
    .header {
      background: linear-gradient(135deg, #1e3a5f 0%, #1e40af 50%, #312e81 100%);
      padding: 16px 20px; display: flex; align-items: center; justify-content: space-between;
      gap: 12px; flex-wrap: wrap; position: sticky; top: 0; z-index: 1000;
      box-shadow: 0 4px 12px rgba(0,0,0,.3);
    }
    .header-brand { display: flex; align-items: center; gap: 12px; }
    .header-icon { background: rgba(255,255,255,.15); border-radius: 50%; width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; }
    .header-title { color: #fff; }
    .header-title h1 { font-size: 1.25rem; font-weight: 800; line-height: 1.3; }
    .header-title p { font-size: .78rem; color: rgba(255,255,255,.8); margin-top: 2px; }
    .header-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .badge-count { background: rgba(255,255,255,.2); color: #fff; border-radius: 20px; padding: 4px 12px; font-size: .82rem; font-weight: 600; }
    .btn-icon { background: rgba(255,255,255,.15); border: none; color: #fff; border-radius: 8px; width: 36px; height: 36px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px; transition: background .15s; }
    .btn-icon:hover { background: rgba(255,255,255,.3); }
    .btn-login { background: rgba(255,255,255,.15); border: 1px solid rgba(255,255,255,.3); color: #fff; border-radius: 8px; padding: 6px 14px; font-family: 'Cairo', sans-serif; font-size: .85rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: background .15s; }
    .btn-login:hover { background: rgba(255,255,255,.25); }

    /* LOADING */
    .loading-bar { position: fixed; top: 0; right: 0; left: 0; height: 3px; background: linear-gradient(90deg, #2563eb, #7c3aed, #2563eb); background-size: 200% 100%; animation: loadbar 1.2s infinite; z-index: 9999; }
    @keyframes loadbar { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    .sync-indicator { font-size: .72rem; background: rgba(255,255,255,.15); color: rgba(255,255,255,.9); border-radius: 12px; padding: 3px 10px; display: flex; align-items: center; gap: 4px; }
    .sync-dot { width: 6px; height: 6px; border-radius: 50%; background: #10b981; flex-shrink: 0; }
    .sync-dot.loading { background: #f59e0b; animation: pulse .8s infinite; }
    .sync-dot.error { background: #ef4444; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .4; } }

    /* CONTAINER */
    .container { max-width: 1280px; margin: 0 auto; padding: 20px 16px; }

    /* ADD FORM */
    .add-form-toggle { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 20px; overflow: hidden; box-shadow: var(--shadow); }
    .add-form-header { padding: 14px 18px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; user-select: none; gap: 8px; }
    .add-form-header:hover { background: var(--surface2); }
    .add-form-header span { font-weight: 700; font-size: .95rem; color: var(--primary); }
    .add-form-header .chevron { transition: transform .2s; font-size: 12px; color: var(--text3); }
    .add-form-header.open .chevron { transform: rotate(180deg); }
    .add-form-body { display: none; padding: 18px; border-top: 1px solid var(--border); }
    .add-form-body.open { display: block; }
    .form-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
    .form-group { display: flex; flex-direction: column; gap: 5px; }
    .form-group label { font-size: .82rem; font-weight: 600; color: var(--text2); }
    .form-group input, .form-group select, .form-group textarea {
      border: 1px solid var(--border); border-radius: 7px; padding: 9px 12px;
      font-family: 'Cairo', sans-serif; font-size: .9rem; background: var(--surface);
      color: var(--text); outline: none; transition: border-color .15s; width: 100%;
    }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--primary); }
    .form-group textarea { resize: vertical; min-height: 72px; }
    .btn-primary { background: var(--primary); color: #fff; border: none; border-radius: 8px; padding: 10px 22px; font-family: 'Cairo', sans-serif; font-size: .92rem; font-weight: 700; cursor: pointer; margin-top: 14px; transition: background .15s; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-primary:disabled { opacity: .6; cursor: not-allowed; }
    .not-logged-msg { text-align: center; padding: 20px; color: var(--text3); font-size: .9rem; }
    .not-logged-msg a { color: var(--primary); cursor: pointer; font-weight: 600; }
    .form-section-title { font-size: .85rem; font-weight: 700; color: var(--primary); margin: 14px 0 8px; padding-bottom: 6px; border-bottom: 1px solid var(--border); grid-column: 1 / -1; }

    /* MAP PICKER */
    .map-picker-wrap { grid-column: 1 / -1; }
    .map-picker-header { display: flex; align-items: center; justify-content: space-between; cursor: pointer; padding: 8px 12px; background: var(--surface2); border-radius: 7px; margin-bottom: 0; font-size: .85rem; font-weight: 600; color: var(--text2); border: 1px solid var(--border); }
    .map-picker-header:hover { background: var(--border); }
    .map-picker-body { display: none; margin-top: 8px; }
    .map-picker-body.open { display: block; }
    .map-container { height: 260px; border-radius: 8px; overflow: hidden; border: 1px solid var(--border); position: relative; z-index: 1; }
    .map-actions { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
    .btn-locate { background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; border-radius: 7px; padding: 7px 14px; font-family: 'Cairo', sans-serif; font-size: .82rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 5px; }
    .btn-locate:hover { background: #d1fae5; }
    body.dark .btn-locate { background: rgba(16,185,129,.1); color: #6ee7b7; border-color: rgba(16,185,129,.3); }
    .coords-display { font-size: .78rem; color: var(--text3); padding: 5px 10px; background: var(--surface2); border-radius: 6px; border: 1px solid var(--border); display: flex; align-items: center; gap: 5px; flex: 1; }

    /* CARD MAP */
    .card-map-section { border-top: 1px solid var(--border); }
    .card-map-toggle { padding: 8px 14px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; font-size: .82rem; color: var(--text3); transition: background .1s; }
    .card-map-toggle:hover { background: var(--surface2); }
    .card-map-toggle .ch { font-size: 10px; transition: transform .2s; }
    .card-map-toggle.open .ch { transform: rotate(180deg); }
    .card-map-body { display: none; padding: 0 10px 10px; }
    .card-map-body.open { display: block; }
    .card-map-inner { height: 180px; border-radius: 7px; overflow: hidden; border: 1px solid var(--border); }
    .card-map-actions { display: flex; gap: 6px; margin-top: 6px; }
    .map-ext-btn { background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; border-radius: 6px; padding: 4px 10px; font-family: 'Cairo', sans-serif; font-size: .75rem; font-weight: 600; cursor: pointer; text-decoration: none; display: flex; align-items: center; gap: 4px; }
    .map-ext-btn:hover { background: #d1fae5; }
    body.dark .map-ext-btn { background: rgba(16,185,129,.1); color: #6ee7b7; border-color: rgba(16,185,129,.3); }

    /* SEARCH */
    .search-wrap { position: relative; margin-bottom: 16px; }
    .search-wrap input { width: 100%; padding: 12px 16px 12px 44px; border: 1px solid var(--border); border-radius: 10px; font-family: 'Cairo', sans-serif; font-size: .95rem; background: var(--surface); color: var(--text); outline: none; transition: border-color .15s, box-shadow .15s; }
    .search-wrap input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,.1); }
    .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text3); font-size: 18px; pointer-events: none; }
    .search-count { font-size: .82rem; color: var(--text3); margin-bottom: 10px; }

    /* CATEGORIES */
    .cats-wrap { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
    .cat-btn { border: 1px solid var(--border); background: var(--surface); color: var(--text2); border-radius: 20px; padding: 6px 16px; font-family: 'Cairo', sans-serif; font-size: .85rem; font-weight: 600; cursor: pointer; transition: all .15s; }
    .cat-btn:hover { background: var(--surface2); }
    .cat-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
    .subcats-wrap { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
    .subcat-btn { border: 1px solid var(--border); background: transparent; color: var(--text3); border-radius: 6px; padding: 4px 12px; font-family: 'Cairo', sans-serif; font-size: .8rem; cursor: pointer; transition: all .15s; }
    .subcat-btn:hover { color: var(--text); }
    .subcat-btn.active { background: #dbeafe; color: var(--primary); border-color: #93c5fd; }
    body.dark .subcat-btn.active { background: rgba(37,99,235,.2); border-color: rgba(37,99,235,.4); }

    /* CARDS */
    .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
    .card { background: var(--surface); border-radius: var(--radius); border-top: 4px solid #6b7280; box-shadow: var(--shadow); display: flex; flex-direction: column; overflow: hidden; transition: box-shadow .15s, transform .1s; position: relative; }
    .card:hover { box-shadow: var(--shadow-lg); transform: translateY(-1px); }
    .card.cat-medical { border-top-color: #10b981; }
    .card.cat-legal { border-top-color: #8b5cf6; }
    .card.cat-shop { border-top-color: #f59e0b; }
    .card.cat-food { border-top-color: #f43f5e; }
    .card.cat-service { border-top-color: #3b82f6; }
    .card.cat-edu { border-top-color: #06b6d4; }
    .card-body { padding: 14px 14px 10px; flex: 1; }
    .card-top { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 10px; }
    .card-icon { font-size: 26px; background: var(--surface2); border-radius: 10px; width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .card-meta { flex: 1; min-width: 0; }
    .card-cats { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 4px; align-items: center; }
    .cat-chip { font-size: .72rem; background: var(--surface2); color: var(--text3); border-radius: 4px; padding: 1px 7px; }
    .card-id { font-size: .72rem; color: var(--text3); font-family: monospace; }
    .card-name { font-weight: 700; font-size: 1rem; line-height: 1.35; }
    .card-address { display: flex; align-items: flex-start; gap: 5px; font-size: .83rem; color: var(--text3); margin-top: 8px; }
    .card-address svg { flex-shrink: 0; margin-top: 2px; }
    .card-status-closed { font-size: .72rem; background: #fee2e2; color: #991b1b; border-radius: 4px; padding: 1px 6px; font-weight: 700; }
    body.dark .card-status-closed { background: rgba(239,68,68,.15); color: #fca5a5; }

    /* EDIT BTN */
    .edit-btn { position: absolute; top: 8px; left: 8px; background: rgba(255,255,255,.85); border: 1px solid var(--border); border-radius: 6px; width: 30px; height: 30px; display: none; align-items: center; justify-content: center; cursor: pointer; font-size: 13px; color: var(--primary); transition: background .1s; z-index: 2; }
    body.dark .edit-btn { background: rgba(30,41,59,.9); }
    .card:hover .edit-btn.visible { display: flex; }

    /* RATINGS */
    .rating-row { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; }
    .stars { display: flex; gap: 1px; direction: ltr; }
    .star { cursor: pointer; color: #d1d5db; transition: color .1s, transform .1s; line-height: 1; }
    .star.filled { color: #f59e0b; }
    .star:hover { transform: scale(1.15); color: #f59e0b; }
    .star-sm { font-size: 15px; } .star-md { font-size: 18px; } .star-lg { font-size: 20px; }
    .rating-info { font-size: .75rem; background: #fef3c7; color: #92400e; border-radius: 12px; padding: 2px 8px; font-weight: 600; }
    body.dark .rating-info { background: rgba(245,158,11,.15); color: #fbbf24; }

    /* MAP BUTTON */
    .map-btn { background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; border-radius: 7px; padding: 5px 12px; font-family: 'Cairo', sans-serif; font-size: .8rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 4px; margin-top: 8px; transition: background .1s; text-decoration: none; width: fit-content; }
    .map-btn:hover { background: #d1fae5; }
    body.dark .map-btn { background: rgba(16,185,129,.1); color: #6ee7b7; border-color: rgba(16,185,129,.3); }

    /* DETAILS TOGGLE */
    .details-toggle { border-top: 1px solid var(--border); padding: 9px 14px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; font-size: .83rem; color: var(--text3); transition: background .1s; }
    .details-toggle:hover { background: var(--surface2); }
    .details-toggle .ch { font-size: 11px; transition: transform .2s; }
    .details-toggle.open .ch { transform: rotate(180deg); }
    .details-body { display: none; padding: 10px 14px 14px; border-top: 1px solid var(--border); font-size: .83rem; color: var(--text2); gap: 8px; flex-direction: column; }
    .details-body.open { display: flex; }
    .detail-row { display: flex; align-items: center; gap: 6px; }
    .detail-row a { color: var(--primary); text-decoration: none; }
    .detail-row a:hover { text-decoration: underline; }

    /* EMPTY STATE */
    .empty { text-align: center; padding: 60px 20px; color: var(--text3); font-size: .95rem; }
    .empty .icon { font-size: 48px; margin-bottom: 12px; }

    /* MODAL */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 2000; align-items: center; justify-content: center; padding: 16px; }
    .modal-overlay.open { display: flex; }
    .modal { background: var(--surface); border-radius: 12px; width: 100%; max-width: 520px; max-height: 90vh; overflow-y: auto; box-shadow: var(--shadow-lg); padding: 24px; }
    .modal h2 { font-size: 1.1rem; font-weight: 800; margin-bottom: 18px; }
    .modal .form-group { margin-bottom: 12px; }
    .modal-footer { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; }
    .btn-secondary { background: var(--surface2); color: var(--text2); border: 1px solid var(--border); border-radius: 8px; padding: 9px 18px; font-family: 'Cairo', sans-serif; font-size: .88rem; font-weight: 600; cursor: pointer; }
    .btn-secondary:hover { background: var(--border); }
    .err-msg { color: #ef4444; font-size: .82rem; margin-top: 8px; }

    /* ADMIN PANEL */
    .admin-panel { display: none; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 20px; padding: 18px; box-shadow: var(--shadow); }
    .admin-panel.open { display: block; }
    .admin-panel h2 { font-size: 1rem; font-weight: 800; margin-bottom: 14px; color: var(--primary); }
    .admin-tabs { display: flex; gap: 4px; margin-bottom: 14px; flex-wrap: wrap; }
    .admin-tab { padding: 6px 14px; border-radius: 7px; font-family: 'Cairo', sans-serif; font-size: .85rem; font-weight: 600; cursor: pointer; border: 1px solid var(--border); background: var(--surface); color: var(--text2); }
    .admin-tab.active { background: var(--primary); color: #fff; border-color: var(--primary); }
    .admin-content { display: none; }
    .admin-content.active { display: block; }
    .audit-table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: .82rem; }
    th, td { padding: 8px 10px; border-bottom: 1px solid var(--border); text-align: right; }
    th { font-weight: 700; color: var(--text2); background: var(--surface2); }
    .action-badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: .75rem; font-weight: 600; }
    .action-create { background: #dcfce7; color: #166534; }
    .action-update { background: #dbeafe; color: #1e40af; }
    .action-delete { background: #fee2e2; color: #991b1b; }
    body.dark .action-create { background: rgba(16,185,129,.15); color: #6ee7b7; }
    body.dark .action-update { background: rgba(37,99,235,.15); color: #93c5fd; }
    body.dark .action-delete { background: rgba(239,68,68,.15); color: #fca5a5; }
    .users-list { display: flex; flex-direction: column; gap: 10px; }
    .user-row { background: var(--surface2); border-radius: 8px; padding: 12px; display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
    .user-info { font-size: .88rem; }
    .user-info strong { display: block; }
    .role-badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: .72rem; font-weight: 700; }
    .role-admin { background: #fef9c3; color: #854d0e; }
    .role-editor { background: #dbeafe; color: #1e40af; }
    .role-viewer { background: #f3f4f6; color: #374151; }
    body.dark .role-admin { background: rgba(234,179,8,.15); color: #fde047; }
    body.dark .role-editor { background: rgba(37,99,235,.15); color: #93c5fd; }
    body.dark .role-viewer { background: rgba(107,114,128,.15); color: #9ca3af; }
    .blocked-badge { background: #fee2e2; color: #991b1b; padding: 1px 7px; border-radius: 8px; font-size: .72rem; font-weight: 700; }
    .user-actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .btn-sm { padding: 5px 10px; font-family: 'Cairo', sans-serif; font-size: .78rem; font-weight: 600; border-radius: 6px; cursor: pointer; border: 1px solid var(--border); background: var(--surface); color: var(--text2); }
    .btn-sm:hover { background: var(--surface2); }
    .btn-sm.danger { color: var(--danger); border-color: #fca5a5; }
    .btn-sm.danger:hover { background: #fee2e2; }
    .filter-row { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
    .filter-row input, .filter-row select { border: 1px solid var(--border); border-radius: 7px; padding: 6px 10px; font-family: 'Cairo', sans-serif; font-size: .82rem; background: var(--surface); color: var(--text); outline: none; }
    .btn-export { margin-right: auto; padding: 6px 14px; font-family: 'Cairo', sans-serif; font-size: .82rem; font-weight: 600; background: var(--surface2); border: 1px solid var(--border); border-radius: 7px; cursor: pointer; color: var(--text2); }
    .btn-export:hover { background: var(--border); }

    /* TOP RATED */
    .top-rated-wrap { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 14px; -webkit-overflow-scrolling: touch; }
    .top-rated-chip { background: linear-gradient(135deg, #fef3c7, #fde68a); color: #92400e; border: 1px solid #fcd34d; border-radius: 20px; padding: 5px 14px; font-size: .82rem; font-weight: 700; white-space: nowrap; cursor: pointer; display: flex; align-items: center; gap: 5px; transition: transform .1s; flex-shrink: 0; }
    .top-rated-chip:hover { transform: translateY(-2px); }
    body.dark .top-rated-chip { background: linear-gradient(135deg, rgba(245,158,11,.2), rgba(245,158,11,.1)); color: #fbbf24; border-color: rgba(245,158,11,.3); }

    /* TOAST */
    .toast-container { position: fixed; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 8px; z-index: 9999; }
    .toast { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 16px; font-size: .85rem; font-weight: 600; box-shadow: var(--shadow-lg); animation: slideIn .2s ease; max-width: 300px; display: flex; align-items: center; gap: 8px; }
    .toast.success { border-right: 4px solid var(--success); }
    .toast.error { border-right: 4px solid var(--danger); }
    @keyframes slideIn { from { transform: translateX(40px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

    /* UTIL */
    .divider { border: none; border-top: 1px solid var(--border); margin: 14px 0; }
    .leaflet-container { font-family: 'Cairo', sans-serif !important; }
    @media (max-width: 500px) {

function getDeviceInfo() {
  const ua = navigator.userAgent || '';

  if (/Chrome/i.test(ua) && !/Edge|OPR/i.test(ua)) browser = 'Chrome';

  else if (/Safari/i.test(ua) && !/Chrome/i.test(ua)) browser = 'Safari';

let entries = [];

// ============================================================
// API HELPERS
// ============================================================
function showLoading() {
  isLoading = true;
  document.getElementById('loading-bar').style.display = 'block';
  setSyncStatus('loading', 'جاري التزامن...');
}
function hideLoading() {
  isLoading = false;
  document.getElementById('loading-bar').style.display = 'none';
  setSyncStatus(apiOnline ? 'ok' : 'error', apiOnline ? 'متصل' : 'غير متصل');
}
function setSyncStatus(state, label) {
  const dot = document.getElementById('sync-dot');
  const lbl = document.getElementById('sync-label');
  if (!dot || !lbl) return;
  dot.className = 'sync-dot' + (state === 'loading' ? ' loading' : state === 'error' ? ' error' : '');
  lbl.textContent = label;
}

async function apiFetch(url, options = {}) {
  try {
    const res = await fetch(url, {
      headers: { 'Content-Type': 'application/json', ...options.headers },
      ...options
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    apiOnline = true;
    return await res.json();
  } catch (err) {
    apiOnline = false;
    console.warn('API error:', err);
    throw err;
  }
}

// Map SheetBest row to internal entry format
function rowToEntry(row) {
  return {
    recordId: row.recordId || '',
    name: row.name || '',
    mainCategory: row.mainCategory || '',
    subCategory: row.subCategory || '',
    governorate: row.governorate || 'حمص',
    district: row.district || '',
    address: row.address || '',
    phone: row.phone || '',
    description: row.description || row.notes || '',
    website: row.website || row.social || '',
    lat: row.lat || '',
    lng: row.lng || '',
    addedBy: row.addedBy || '',
    addedAt: row.addedAt || row.createdAt || '',
    updatedAt: row.updatedAt || '',
    status: row.status || 'نشط',
    ratingAvg: row.ratingAvg ? parseFloat(row.ratingAvg) || null : null,
    ratingCount: parseInt(row.ratingCount) || 0,
  };
}

function rowToUser(row) {
  return {
    userId: row.userId || '',
    username: row.username || '',
    password: row.password || '',
    email: row.email || '',
    phone: row.phone || '',
    role: row.role || 'editor',
    status: row.status || 'active',
    dailyEditLimit: parseInt(row.dailyEditLimit) || 7,
    registeredAt: row.registeredAt || '',
    lastLogin: row.lastLogin || '',
    accountType: row.accountType || 'user',
  };
}

async function init() {
  ratings = loadJSON(STORAGE_KEYS.ratings, {});
  session = loadJSON(STORAGE_KEYS.session, null);
  darkMode = localStorage.getItem('homs_dark') === '1';
  if (darkMode) document.body.classList.add('dark');
  document.getElementById('dark-btn').textContent = darkMode ? '☀️' : '🌙';

  // Load from cache first (fast)
  const cachedEntries = loadJSON(STORAGE_KEYS.entries, null);
  const cachedUsers = loadJSON(STORAGE_KEYS.users, null);
  entries = cachedEntries || getDefaultEntries();
  users = cachedUsers || getDefaultUsers();
  audit = loadJSON(STORAGE_KEYS.audit, []);

  // Seed defaults to API if first run
  if (!cachedEntries) {
    saveJSON(STORAGE_KEYS.entries, entries);
    seedDefaultsToAPI();
  }
  if (!cachedUsers) {
    saveJSON(STORAGE_KEYS.users, users);
    seedUsersToAPI();
  }

  render();

  // Fetch fresh data from API
  await loadFromAPI();
}

async function seedDefaultsToAPI() {
  try {
    await apiFetch(API_SHEET1, { method: 'POST', body: JSON.stringify(entries) });
  } catch (e) { console.warn('Seed entries failed:', e); }
}

async function seedUsersToAPI() {
  try {
    await apiFetch(API_SHEET2, { method: 'POST', body: JSON.stringify(users) });
  } catch (e) { console.warn('Seed users failed:', e); }
}

async function loadFromAPI() {
  showLoading();
  try {
    const [remoteEntries, remoteUsers] = await Promise.all([
      apiFetch(API_SHEET1).catch(() => null),
      apiFetch(API_SHEET2).catch(() => null),
    ]);

    if (remoteEntries && Array.isArray(remoteEntries) && remoteEntries.length > 0) {
      entries = remoteEntries.map(rowToEntry).filter(e => e.recordId && e.name);
      saveJSON(STORAGE_KEYS.entries, entries);
      saveJSON(STORAGE_KEYS.cacheTime, Date.now());
    }
    if (remoteUsers && Array.isArray(remoteUsers) && remoteUsers.length > 0) {
      users = remoteUsers.map(rowToUser).filter(u => u.username);
      // Ensure admin always exists
      if (!users.find(u => u.role === 'admin')) {
        users.unshift(getDefaultUsers()[0]);
      }
      saveJSON(STORAGE_KEYS.users, users);
      saveJSON(STORAGE_KEYS.usersCacheTime, Date.now());
    }

    render();
    setSyncStatus('ok', 'متصل');
  } catch (err) {
    setSyncStatus('error', 'بدون إنترنت');
  } finally {
    hideLoading();
  }
}

async function refreshData() {
  toast('جاري تحديث البيانات...', 'success');
  await loadFromAPI();
}

async function handleLogin() {
  const username = document.getElementById('m-username').value.trim();
  const password = document.getElementById('m-password').value;
  const errEl = document.getElementById('m-err');
  errEl.textContent = '';
  if (!username || !password) { errEl.textContent = 'يرجى ملء جميع الحقول'; return; }

  const btn = document.getElementById('m-submit');
  btn.disabled = true;

  if (authMode === 'login') {
    // Check local first, then API
    let user = users.find(u => u.username === username && u.password === password);
    if (!user) {
      // Try fetching fresh users from API
      try {
        const fresh = await apiFetch(API_SHEET2 + '/search?query[username]=' + encodeURIComponent(username));
        if (fresh && fresh.length > 0) {
          const apiUser = rowToUser(fresh[0]);
          if (apiUser.password === password) user = apiUser;
        }
      } catch(e) {}
    }
    btn.disabled = false;
    if (!user) { errEl.textContent = 'اسم المستخدم أو كلمة المرور غير صحيحة'; return; }
    if (user.status === 'blocked') { errEl.textContent = 'تم إيقاف حسابك من قِبل المشرف'; return; }
    session = { id: user.userId, username: user.username, role: user.role, isBlocked: user.status === 'blocked', dailyEditLimit: user.dailyEditLimit || 7 };
    saveJSON(STORAGE_KEYS.session, session);
    // Update lastLogin in API
    updateUserLastLogin(user.userId);
    closeLoginModal();
    toast('مرحباً، ' + user.username + ' 👋', 'success');
    render();
  } else {
    // Register
    const email = document.getElementById('m-email').value.trim();
    const phone = document.getElementById('m-phone-reg').value.trim();
    if (username.length < 3) { btn.disabled = false; errEl.textContent = 'اسم المستخدم يجب أن يكون 3 أحرف على الأقل'; return; }
    if (password.length < 6) { btn.disabled = false; errEl.textContent = 'كلمة المرور يجب أن تكون 6 أحرف على الأقل'; return; }
    if (users.find(u => u.username === username)) { btn.disabled = false; errEl.textContent = 'اسم المستخدم موجود بالفعل'; return; }
    const now = new Date().toISOString();
    const newUser = {
      userId: 'user_' + Date.now(),
      username, password, email, phone,
      role: 'editor', status: 'active',
      dailyEditLimit: 7, registeredAt: now,
      lastLogin: now, accountType: 'user'
    };
    users.push(newUser);
    saveJSON(STORAGE_KEYS.users, users);
    // Sync to API
    try { await apiFetch(API_SHEET2, { method: 'POST', body: JSON.stringify([newUser]) }); } catch(e) {}
    btn.disabled = false;
    session = { id: newUser.userId, username: newUser.username, role: 'editor', isBlocked: false, dailyEditLimit: 7 };
    saveJSON(STORAGE_KEYS.session, session);
    // Log to audit
    await logAuditAPI({ action: 'register', entryName: 'تسجيل مستخدم: ' + username, entryId: newUser.userId });
    closeLoginModal();
    toast('تم إنشاء الحساب بنجاح! مرحباً، ' + username + ' 🎉', 'success');
    render();
  }
}

async function updateUserLastLogin(userId) {
  try {
    await apiFetch(API_SHEET2 + '/search?query[userId]=' + encodeURIComponent(userId), {
      method: 'PATCH',
      body: JSON.stringify({ lastLogin: new Date().toISOString() })
    });
  } catch(e) {}
}

function toggleAddPickerMap() {
  addPickerOpen = !addPickerOpen;
  const body = document.getElementById('add-map-picker-body');
  const chevron = document.getElementById('picker-chevron');
  if (!body) return;
  body.classList.toggle('open', addPickerOpen);
  if (chevron) chevron.textContent = addPickerOpen ? '▲' : '▼';
  if (addPickerOpen) {
    setTimeout(() => initAddPickerMap(), 100);
  }
}

function initAddPickerMap() {
  if (addPickerMap) { addPickerMap.invalidateSize(); return; }
  const el = document.getElementById('add-picker-map');
  if (!el) return;
  // Default: Homs city center
  const homsCenterLat = 34.7324, homsCenterLng = 36.7137;
  addPickerMap = L.map('add-picker-map', { tap: true, zoomControl: true }).setView([homsCenterLat, homsCenterLng], 13);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap',
    maxZoom: 19
  }).addTo(addPickerMap);

  addPickerMap.on('click', function(e) {
    setPickerMarker(e.latlng.lat, e.latlng.lng);
  });
}

function setPickerMarker(lat, lng) {
  if (!addPickerMap) return;
  const latR = Math.round(lat * 1000000) / 1000000;
  const lngR = Math.round(lng * 1000000) / 1000000;
  if (addPickerMarker) {
    addPickerMarker.setLatLng([latR, lngR]);
  } else {
    addPickerMarker = L.marker([latR, lngR], { draggable: true }).addTo(addPickerMap);
    addPickerMarker.on('dragend', function(e) {
      const pos = e.target.getLatLng();
      setPickerMarker(pos.lat, pos.lng);
    });
  }
  addPickerMap.panTo([latR, lngR]);
  const latEl = document.getElementById('f-lat');
  const lngEl = document.getElementById('f-lng');
  if (latEl) latEl.value = latR;
  if (lngEl) lngEl.value = lngR;
  const disp = document.getElementById('coords-display');
  if (disp) disp.textContent = '📌 ' + latR + ', ' + lngR;
}

function updatePickerFromInputs() {
  const lat = parseFloat(document.getElementById('f-lat')?.value);
  const lng = parseFloat(document.getElementById('f-lng')?.value);
  if (!isNaN(lat) && !isNaN(lng) && addPickerMap) {
    setPickerMarker(lat, lng);
  }
}

function locateMe() {
  if (!navigator.geolocation) { toast('خدمة الموقع غير مدعومة في هذا الجهاز', 'error'); return; }
  toast('جاري تحديد موقعك...', 'success');
  navigator.geolocation.getCurrentPosition(
    function(pos) {
      if (!addPickerMap) initAddPickerMap();
      addPickerMap.setView([pos.coords.latitude, pos.coords.longitude], 16);
      setPickerMarker(pos.coords.latitude, pos.coords.longitude);
      toast('تم تحديد موقعك بنجاح 📍', 'success');
    },
    function(err) {
      toast('تعذر تحديد الموقع: ' + (err.message || 'خطأ غير معروف'), 'error');
    },
    { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 }
  );
}

    <a href="https://www.openstreetmap.org/?mlat=${lat}&mlon=${lng}&zoom=16" target="_blank" class="map-ext-btn">🌍 فتح في OpenStreetMap</a>
  `;
  document.getElementById('map-modal').classList.add('open');

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(modalMap);
    L.marker([lat, lng]).addTo(modalMap).bindPopup(esc(entry.name)).openPopup();
    setTimeout(() => modalMap.invalidateSize(), 100);

function closeMapModal() {

function renderCards() {
  const filtered = getFilteredEntries();
  const grid = document.getElementById('cards-grid');
  const sc = document.getElementById('search-count');
  sc.textContent = searchQ ? `${filtered.length} نتيجة للبحث عن "${searchQ}"` : '';
  if (filtered.length === 0) {
    grid.innerHTML = `<div class="empty" style="grid-column:1/-1"><div class="icon">🔍</div><p>لا توجد نتائج مطابقة للبحث</p></div>`;
    return;
  }
  grid.innerHTML = filtered.map(e => renderCard(e)).join('');
}

function renderCard(e) {
  const fp = getFingerprint();
  const rKey = e.recordId + '_' + fp;
  const myRating = ratings[rKey] || 0;
  const avgRating = parseFloat(e.ratingAvg) || 0;
  const stars = [1,2,3,4,5].map(s => {
    const sz = s <= 2 ? 'star-sm' : s === 3 ? 'star-md' : 'star-lg';
    const filled = myRating > 0 ? s <= myRating : (avgRating && s <= Math.round(avgRating));
    return `<span class="star ${sz} ${filled ? 'filled' : ''}" onclick="rateEntry('${esc(e.recordId)}', ${s})">★</span>`;
  }).join('');

  const canEdit = session && (session.role === 'admin' || session.role === 'editor') && !session.isBlocked;
  const editBtn = canEdit ? `<button class="edit-btn visible" onclick="openEditModal('${esc(e.recordId)}')" title="تعديل">✏️</button>` : '';
  const ratingInfo = e.ratingCount > 0 ? `<span class="rating-info">⭐ ${avgRating.toFixed(1)} (${e.ratingCount})</span>` : '';
  const statusBadge = e.status === 'مغلق' ? `<span class="card-status-closed">مغلق</span>` : '';

  const hasCoords = e.lat && e.lng && !isNaN(parseFloat(e.lat)) && !isNaN(parseFloat(e.lng));
  const mapSection = hasCoords ? `
    <div class="card-map-section">
      <div class="card-map-toggle" id="card-map-toggle-${esc(e.recordId)}" onclick="toggleCardMap('${esc(e.recordId)}')">
        <span>🗺️ عرض الموقع على الخريطة</span><span class="ch">▼</span>
      </div>
      <div class="card-map-body" id="card-map-body-${esc(e.recordId)}">
        <div class="card-map-inner" id="card-map-inner-${esc(e.recordId)}"></div>
        <div class="card-map-actions">
          <button class="map-ext-btn" onclick="openMapModal('${esc(e.recordId)}')">🔍 تكبير الخريطة</button>
          <a href="https://maps.google.com/?q=${e.lat},${e.lng}" target="_blank" class="map-ext-btn">🗺️ Google Maps</a>
        </div>
      </div>
    </div>` : (e.website && e.website.includes('maps.google.com') ? `
    <div style="padding:0 14px 10px">
      <a href="${esc(e.website)}" target="_blank" class="map-btn">🗺️ موقع على الخريطة</a>
    </div>` : '');

  const details = [];
  if (e.phone) details.push(`<div class="detail-row">📞 <a href="tel:${esc(e.phone)}">${esc(e.phone)}</a></div>`);
  if (e.description) details.push(`<div class="detail-row">🕐 ${esc(e.description)}</div>`);
  if (e.website && !e.website.includes('maps.google.com')) details.push(`<div class="detail-row">🔗 <a href="${esc(e.website)}" target="_blank">الموقع الإلكتروني</a></div>`);
  if (e.addedBy) details.push(`<div class="detail-row" style="color:var(--text3);font-size:.75rem">أضافه: ${esc(e.addedBy)}</div>`);

  return `
    <div class="card ${getCatCls(e.mainCategory)}" id="card-${esc(e.recordId)}">
      ${editBtn}
      <div class="card-body">
        <div class="card-top">
          <div class="card-icon">${getCatIcon(e.mainCategory)}</div>
          <div class="card-meta">
            <div class="card-cats">
              <span class="cat-chip">${esc(e.mainCategory)}</span>
              <span class="cat-chip">${esc(e.subCategory)}</span>
              ${statusBadge}
            </div>
            <div class="card-name">${esc(e.name)}</div>
          </div>
        </div>
        <div class="card-address">
          <svg width="12" height="14" viewBox="0 0 12 14" fill="none"><path d="M6 0C3.24 0 1 2.19 1 4.88c0 3.65 5 9.12 5 9.12s5-5.47 5-9.12C11 2.19 8.76 0 6 0Zm0 6.63a1.75 1.75 0 1 1 0-3.5 1.75 1.75 0 0 1 0 3.5Z" fill="currentColor"/></svg>
          ${esc(e.address)}${e.district ? ' — ' + esc(e.district) : ''}${e.governorate && e.governorate !== 'حمص' ? ' — ' + esc(e.governorate) : ''}
        </div>
        <div class="rating-row">
          <div class="stars">${stars}</div>
          ${ratingInfo}
        </div>
      </div>
      ${details.length > 0 ? `
      <div class="details-toggle" onclick="toggleDetails(this)">
        <span>التفاصيل والتواصل</span><span class="ch">▼</span>
      </div>
      <div class="details-body">
        ${details.join('')}
      </div>` : ''}
      ${mapSection}
    </div>
  `;
}

function toggleDetails(el) {
  el.classList.toggle('open');
  el.nextElementSibling.classList.toggle('open');
}

// ============================================================
// RATINGS
// ============================================================
async function rateEntry(entryId, value) {
  const fp = getFingerprint();
  const rKey = entryId + '_' + fp;
  if (ratings[rKey]) { toast('لقد قيّمت هذه المنشأة مسبقاً', 'error'); return; }
  ratings[rKey] = value;
  saveJSON(STORAGE_KEYS.ratings, ratings);
  const entry = entries.find(e => e.recordId === entryId);
  if (entry) {
    const allRatings = Object.entries(ratings).filter(([k]) => k.startsWith(entryId + '_')).map(([,v]) => v);
    entry.ratingAvg = allRatings.reduce((a, b) => a + b, 0) / allRatings.length;
    entry.ratingCount = allRatings.length;
    saveJSON(STORAGE_KEYS.entries, entries);
    // Sync rating to API
    try {
      await apiFetch(API_SHEET1 + '/search?query[recordId]=' + encodeURIComponent(entryId), {
        method: 'PATCH',
        body: JSON.stringify({ ratingAvg: entry.ratingAvg.toFixed(2), ratingCount: entry.ratingCount })
      });
    } catch(e) {}
  }
  toast('شكراً على تقييمك ⭐', 'success');
  renderCards();
  renderTopRated();
}

// ============================================================
// EDIT MODAL
// ============================================================
function openEditModal(id) {
  editingId = id;
  const e = entries.find(x => x.recordId === id);
  if (!e) return;
  const cats = [...new Set(entries.map(e => e.mainCategory).filter(Boolean))];
  const subcats = [...new Set(entries.filter(x => x.mainCategory === e.mainCategory).map(x => x.subCategory).filter(Boolean))];
  const governorates = ['حمص', 'حماه', 'دمشق', 'حلب', 'اللاذقية', 'طرطوس', 'دير الزور', 'الرقة', 'درعا', 'السويداء', 'القنيطرة', 'الحسكة', 'إدلب'];
  const inner = document.getElementById('edit-form-inner');
  inner.innerHTML = `
    <div class="form-group"><label>الاسم *</label><input type="text" id="e-name" value="${esc(e.name)}"></div>
    <div class="form-group">
      <label>التصنيف الرئيسي *</label>
      <select id="e-maincat">${cats.map(c => `<option ${c===e.mainCategory?'selected':''}>${esc(c)}</option>`).join('')}</select>
    </div>
    <div class="form-group">
      <label>التصنيف الفرعي *</label>
      <select id="e-subcat">${subcats.map(s => `<option ${s===e.subCategory?'selected':''}>${esc(s)}</option>`).join('')}</select>
    </div>
    <div class="form-group">
      <label>المحافظة</label>
      <select id="e-gov">${governorates.map(g => `<option ${g===(e.governorate||'حمص')?'selected':''}>${g}</option>`).join('')}</select>
    </div>
    <div class="form-group"><label>المنطقة / الحي</label><input type="text" id="e-district" value="${esc(e.district||'')}"></div>
    <div class="form-group"><label>العنوان *</label><input type="text" id="e-address" value="${esc(e.address)}"></div>
    <div class="form-group"><label>الهاتف</label><input type="tel" id="e-phone" value="${esc(e.phone||'')}"></div>
    <div class="form-group"><label>الموقع الإلكتروني</label><input type="url" id="e-website" value="${esc(e.website||'')}"></div>
    <div class="form-group"><label>الملاحظات</label><textarea id="e-notes">${esc(e.description||'')}</textarea></div>
    <div style="display:flex;gap:8px;">
      <div class="form-group" style="flex:1"><label>خط العرض</label><input type="text" id="e-lat" value="${esc(e.lat||'')}" placeholder="34.7324"></div>
      <div class="form-group" style="flex:1"><label>خط الطول</label><input type="text" id="e-lng" value="${esc(e.lng||'')}" placeholder="36.7137"></div>
    </div>
    ${session?.role === 'admin' ? `
    <div class="form-group"><label>الحالة</label>
      <select id="e-status"><option ${(e.status||'نشط')==='نشط'?'selected':''}>نشط</option><option ${e.status==='مغلق'?'selected':''}>مغلق</option></select>
    </div>` : ''}
  `;
  document.getElementById('edit-err').textContent = '';
  document.getElementById('edit-modal').classList.add('open');
}

function closeEditModal() { document.getElementById('edit-modal').classList.remove('open'); editingId = null; }

async function saveEdit() {
  if (!editingId) return;
  if (!session) { toast('يجب تسجيل الدخول', 'error'); return; }

  // Daily edit limit check
  if (session.role !== 'admin') {
    const today = new Date().toDateString();
    const todayEdits = audit.filter(a => a.userId === session.id && a.action === 'update' && new Date(a.date || a.createdAt).toDateString() === today).length;
    if (todayEdits >= (session.dailyEditLimit || 7)) {
      document.getElementById('edit-err').textContent = `تجاوزت الحد اليومي (${session.dailyEditLimit} تعديلات). يُعاد التعيين غداً.`;
      return;
    }
  }

  const e = entries.find(x => x.recordId === editingId);
  if (!e) return;
  const oldValues = JSON.stringify(e);

  const name = document.getElementById('e-name')?.value.trim();
  const mainCategory = document.getElementById('e-maincat')?.value;
  const subCategory = document.getElementById('e-subcat')?.value;
  const address = document.getElementById('e-address')?.value.trim();
  if (!name || !mainCategory || !subCategory || !address) {
    document.getElementById('edit-err').textContent = 'يرجى ملء جميع الحقول المطلوبة'; return;
  }

  const btn = document.querySelector('#edit-modal .btn-primary');
  if (btn) { btn.disabled = true; btn.textContent = '⏳ جاري الحفظ...'; }

  e.name = name;
  e.mainCategory = mainCategory;
  e.subCategory = subCategory;
  e.governorate = document.getElementById('e-gov')?.value || e.governorate;
  e.district = document.getElementById('e-district')?.value.trim() || '';
  e.address = address;
  e.phone = document.getElementById('e-phone')?.value.trim() || '';
  e.website = document.getElementById('e-website')?.value.trim() || '';
  e.description = document.getElementById('e-notes')?.value.trim() || '';
  e.lat = document.getElementById('e-lat')?.value.trim() || '';
  e.lng = document.getElementById('e-lng')?.value.trim() || '';
  if (session.role === 'admin') e.status = document.getElementById('e-status')?.value || e.status;
  e.updatedAt = new Date().toISOString();

  saveJSON(STORAGE_KEYS.entries, entries);

  // Sync to API
  try {
    await apiFetch(API_SHEET1 + '/search?query[recordId]=' + encodeURIComponent(editingId), {
      method: 'PATCH',
      body: JSON.stringify(e)
    });
    toast('تم حفظ التعديلات بنجاح ✅', 'success');
  } catch(err) {
    toast('تم الحفظ محلياً — سيتم التزامن لاحقاً', 'success');
  }

  await logAuditAPI({ action: 'update', entryId: e.recordId, entryName: e.name, oldValues, newValues: JSON.stringify(e) });

  if (btn) { btn.disabled = false; btn.textContent = '💾 حفظ التعديلات'; }
  // Destroy card map if it was initialized
  if (cardMaps[editingId]) { cardMaps[editingId].remove(); delete cardMaps[editingId]; }
  closeEditModal();
  render();
}

// ============================================================
// AUDIT LOG
// ============================================================
async function logAuditAPI(data) {
  const fp = getFingerprint();
  const { browser, os, device } = getDeviceInfo();
  const now = new Date();
  const logEntry = {
    logId: 'log_' + Date.now(),
    username: session?.username || 'غير معروف',
    userId: session?.id || '',
    operationType: data.action,
    recordName: data.entryName || '',
    recordId: data.entryId || '',
    oldData: data.oldValues || '',
    newData: data.newValues || '',
    date: now.toLocaleDateString('ar-SY'),
    time: now.toLocaleTimeString('ar-SY'),
    ip: '',
    device, browser, os,
    fingerprint: fp,
    createdAt: now.toISOString(),
  };

  // Store locally
  audit.push({ ...logEntry, action: data.action, entryName: data.entryName });
  saveJSON(STORAGE_KEYS.audit, audit);

  // Push to API
  try {
    await apiFetch(API_LOG, { method: 'POST', body: JSON.stringify([logEntry]) });
  } catch(e) {}
}

function renderAudit() {
  const fUser = document.getElementById('f-user')?.value.toLowerCase() || '';
  const fAction = document.getElementById('f-action')?.value || '';
  const filtered = audit.filter(a => {
    if (fUser && !(a.username||'').toLowerCase().includes(fUser)) return false;
    if (fAction && a.action !== fAction && a.operationType !== fAction) return false;
    return true;
  }).slice().reverse().slice(0, 100);
  const tbody = document.getElementById('audit-tbody');
  if (!tbody) return;
  if (filtered.length === 0) { tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;color:var(--text3)">لا توجد سجلات</td></tr>'; return; }
  const LABELS = { create: 'إضافة', update: 'تعديل', delete: 'حذف', register: 'تسجيل' };
  tbody.innerHTML = filtered.map(a => `
    <tr>
      <td><strong>${esc(a.username||'')}</strong></td>
      <td><span class="action-badge action-${a.action||a.operationType}">${LABELS[a.action||a.operationType] || a.action}</span></td>
      <td>${esc(a.entryName||a.recordName||'')}</td>
      <td style="white-space:nowrap">${a.date||new Date(a.createdAt).toLocaleString('ar-SY')}</td>
    </tr>
  `).join('');
}

function exportCSV() {
  const rows = [['المستخدم', 'العملية', 'المنشأة', 'التاريخ', 'الجهاز', 'المتصفح', 'البصمة']];
  audit.forEach(a => rows.push([
    a.username, a.action||a.operationType, a.entryName||a.recordName,
    a.date||a.createdAt, a.device||'', a.browser||'', a.fingerprint||''
  ]));
  const csv = rows.map(r => r.map(c => '"' + String(c||'').replace(/"/g, '""') + '"').join(',')).join('\n');
  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = 'homs-audit-' + new Date().toISOString().split('T')[0] + '.csv';
  link.click();
}

// ============================================================
// USER MANAGEMENT
// ============================================================
function renderUsers() {
  const list = document.getElementById('users-list');
  if (!list) return;
  list.innerHTML = users.map(u => `
    <div class="user-row">
      <div class="user-info">
        <strong>${esc(u.username)}</strong>
        <div style="font-size:.75rem;color:var(--text3);margin-top:1px">${esc(u.email||'')}${u.phone?' — '+esc(u.phone):''}</div>
        <div style="display:flex;gap:6px;align-items:center;margin-top:3px;flex-wrap:wrap">
          <span class="role-badge role-${u.role}">${u.role === 'admin' ? '🛡️ مشرف' : u.role === 'editor' ? '✏️ محرر' : '👁️ قارئ'}</span>
          ${u.status === 'blocked' ? '<span class="blocked-badge">🚫 موقوف</span>' : ''}
          <span style="font-size:.72rem;color:var(--text3)">حد يومي: ${u.dailyEditLimit||7}</span>
        </div>
      </div>
      <div class="user-actions">
        ${u.role !== 'admin' ? `
          <button class="btn-sm" onclick="toggleBlock('${esc(u.userId)}')">${u.status === 'blocked' ? '✅ فتح الحساب' : '🚫 إيقاف'}</button>
          <button class="btn-sm" onclick="changeLimit('${esc(u.userId)}')">تعديل الحد</button>
          <button class="btn-sm" onclick="changeRole('${esc(u.userId)}')">تغيير الدور</button>
        ` : '<span style="font-size:.75rem;color:var(--text3)">الحساب الرئيسي</span>'}
      </div>
    </div>
  `).join('');
}

async function toggleBlock(userId) {
  const u = users.find(x => x.userId === userId);
  if (!u) return;
  u.status = u.status === 'blocked' ? 'active' : 'blocked';
  saveJSON(STORAGE_KEYS.users, users);
  try {
    await apiFetch(API_SHEET2 + '/search?query[userId]=' + encodeURIComponent(userId), {
      method: 'PATCH', body: JSON.stringify({ status: u.status })
    });
  } catch(e) {}
  toast(u.status === 'blocked' ? `تم إيقاف ${u.username}` : `تم فتح حساب ${u.username}`, 'success');
  renderUsers();
}

async function changeLimit(userId) {
  const u = users.find(x => x.userId === userId);
  if (!u) return;
  const val = prompt(`الحد اليومي الحالي لـ "${u.username}": ${u.dailyEditLimit||7}\nأدخل الحد الجديد:`, u.dailyEditLimit||7);
  if (val === null) return;
  const n = parseInt(val);
  if (isNaN(n) || n < 0) { toast('قيمة غير صحيحة', 'error'); return; }
  u.dailyEditLimit = n;
  saveJSON(STORAGE_KEYS.users, users);
  try {
    await apiFetch(API_SHEET2 + '/search?query[userId]=' + encodeURIComponent(userId), {
      method: 'PATCH', body: JSON.stringify({ dailyEditLimit: n })
    });
  } catch(e) {}
  toast(`تم تحديث حد ${u.username} إلى ${n} تعديل/يوم`, 'success');
  renderUsers();
}

async function changeRole(userId) {
  const u = users.find(x => x.userId === userId);
  if (!u) return;
  const ROLES = ['editor', 'viewer'];
  const next = ROLES[(ROLES.indexOf(u.role) + 1) % ROLES.length];
  u.role = next;
  saveJSON(STORAGE_KEYS.users, users);
  try {
    await apiFetch(API_SHEET2 + '/search?query[userId]=' + encodeURIComponent(userId), {
      method: 'PATCH', body: JSON.stringify({ role: next })
    });
  } catch(e) {}
  toast(`تم تغيير دور ${u.username} إلى ${next}`, 'success');
  renderUsers();
}

// ============================================================
// ADMIN TABS
// ============================================================
function switchAdminTab(tab) {
  document.querySelectorAll('.admin-tab').forEach((t, i) => t.classList.toggle('active', (i === 0) === (tab === 'audit')));
  document.getElementById('admin-audit').classList.toggle('active', tab === 'audit');
  document.getElementById('admin-users').classList.toggle('active', tab === 'users');
  if (tab === 'audit') renderAudit();
  if (tab === 'users') renderUsers();
}

// ============================================================
// TOAST
// ============================================================
function toast(msg, type = 'success') {
  const c = document.getElementById('toast-container');
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  t.textContent = msg;
  c.appendChild(t);
  setTimeout(() => { if (t.parentNode) t.remove(); }, 3500);
}

// ============================================================
// UTIL
// ============================================================
function esc(str) {
  return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// ============================================================
// KEYBOARD SHORTCUTS
// ============================================================
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeLoginModal(); closeEditModal(); closeMapModal(); }
  if ((e.ctrlKey || e.metaKey) && e.key === 'k') { e.preventDefault(); document.getElementById('search-input').focus(); }
});

// Close modals on overlay click
document.getElementById('login-modal').addEventListener('click', e => { if (e.target === e.currentTarget) closeLoginModal(); });
document.getElementById('edit-modal').addEventListener('click', e => { if (e.target === e.currentTarget) closeEditModal(); });
document.getElementById('map-modal').addEventListener('click', e => { if (e.target === e.currentTarget) closeMapModal(); });

// Enter key in login form
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && document.getElementById('login-modal').classList.contains('open')) handleLogin();
});

// ============================================================
// START
// ============================================================
init().catch(err => {
  console.error('Init error:', err);
  // Ensure UI still shows even if API fails
  render();
  setSyncStatus('error', 'بدون إنترنت');
  hideLoading();
});
</script>
