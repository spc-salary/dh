<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دليل مدينة حمص الخدمي والتجاري</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f5f7fa;
      --surface: #ffffff;
      --surface2: #f0f4f8;
      --border: #e2e8f0;
      --text: #1a202c;
      --text2: #4a5568;
      --text3: #718096;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --danger: #ef4444;
      --success: #10b981;
      --shadow: 0 1px 3px rgba(0,0,0,.1), 0 1px 2px rgba(0,0,0,.06);
      --shadow-lg: 0 10px 15px -3px rgba(0,0,0,.1), 0 4px 6px -2px rgba(0,0,0,.05);
      --radius: 10px;
    }
    body.dark {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface2: #0f172a;
      --border: #334155;
      --text: #f1f5f9;
      --text2: #cbd5e1;
      --text3: #94a3b8;
      --shadow: 0 1px 3px rgba(0,0,0,.4);
      --shadow-lg: 0 10px 15px -3px rgba(0,0,0,.4);
    }
    body {
      font-family: 'Cairo', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      transition: background .2s, color .2s;
    }

    /* HEADER */
    .header {
      background: linear-gradient(135deg, #1e3a5f 0%, #1e40af 50%, #312e81 100%);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 12px rgba(0,0,0,.3);
    }
    .header-brand { display: flex; align-items: center; gap: 12px; }
    .header-icon {
      background: rgba(255,255,255,.15);
      border-radius: 50%;
      width: 48px; height: 48px;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
    }
    .header-title { color: #fff; }
    .header-title h1 { font-size: 1.25rem; font-weight: 800; line-height: 1.3; }
    .header-title p { font-size: .78rem; color: rgba(255,255,255,.8); margin-top: 2px; }
    .header-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .badge-count {
      background: rgba(255,255,255,.2);
      color: #fff;
      border-radius: 20px;
      padding: 4px 12px;
      font-size: .82rem;
      font-weight: 600;
    }
    .btn-icon {
      background: rgba(255,255,255,.15);
      border: none;
      color: #fff;
      border-radius: 8px;
      width: 36px; height: 36px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
      transition: background .15s;
    }
    .btn-icon:hover { background: rgba(255,255,255,.3); }
    .btn-login {
      background: rgba(255,255,255,.15);
      border: 1px solid rgba(255,255,255,.3);
      color: #fff;
      border-radius: 8px;
      padding: 6px 14px;
      font-family: 'Cairo', sans-serif;
      font-size: .85rem;
      font-weight: 600;
      cursor: pointer;
      display: flex; align-items: center; gap: 6px;
      transition: background .15s;
    }
    .btn-login:hover { background: rgba(255,255,255,.25); }

    /* MAIN CONTAINER */
    .container { max-width: 1280px; margin: 0 auto; padding: 20px 16px; }

    /* ADD FORM */
    .add-form-toggle {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 20px;
      overflow: hidden;
      box-shadow: var(--shadow);
    }
    .add-form-header {
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      user-select: none;
      gap: 8px;
    }
    .add-form-header:hover { background: var(--surface2); }
    .add-form-header span { font-weight: 700; font-size: .95rem; color: var(--primary); }
    .add-form-header .chevron { transition: transform .2s; font-size: 12px; color: var(--text3); }
    .add-form-header.open .chevron { transform: rotate(180deg); }
    .add-form-body { display: none; padding: 18px; border-top: 1px solid var(--border); }
    .add-form-body.open { display: block; }
    .form-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
    .form-group { display: flex; flex-direction: column; gap: 5px; }
    .form-group label { font-size: .82rem; font-weight: 600; color: var(--text2); }
    .form-group input, .form-group select, .form-group textarea {
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 9px 12px;
      font-family: 'Cairo', sans-serif;
      font-size: .9rem;
      background: var(--surface);
      color: var(--text);
      outline: none;
      transition: border-color .15s;
      width: 100%;
    }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
      border-color: var(--primary);
    }
    .form-group textarea { resize: vertical; min-height: 72px; }
    .btn-primary {
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 22px;
      font-family: 'Cairo', sans-serif;
      font-size: .92rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 14px;
      transition: background .15s;
    }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-primary:disabled { opacity: .6; cursor: not-allowed; }
    .not-logged-msg {
      text-align: center;
      padding: 20px;
      color: var(--text3);
      font-size: .9rem;
    }
    .not-logged-msg a { color: var(--primary); cursor: pointer; font-weight: 600; }

    /* SEARCH */
    .search-wrap {
      position: relative;
      margin-bottom: 16px;
    }
    .search-wrap input {
      width: 100%;
      padding: 12px 16px 12px 44px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-family: 'Cairo', sans-serif;
      font-size: .95rem;
      background: var(--surface);
      color: var(--text);
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    .search-wrap input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,.1); }
    .search-icon {
      position: absolute;
      left: 14px; top: 50%;
      transform: translateY(-50%);
      color: var(--text3);
      font-size: 18px;
      pointer-events: none;
    }
    .search-count { font-size: .82rem; color: var(--text3); margin-bottom: 10px; }

    /* CATEGORIES */
    .cats-wrap { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
    .cat-btn {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text2);
      border-radius: 20px;
      padding: 6px 16px;
      font-family: 'Cairo', sans-serif;
      font-size: .85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all .15s;
    }
    .cat-btn:hover { background: var(--surface2); }
    .cat-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
    .subcats-wrap { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
    .subcat-btn {
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text3);
      border-radius: 6px;
      padding: 4px 12px;
      font-family: 'Cairo', sans-serif;
      font-size: .8rem;
      cursor: pointer;
      transition: all .15s;
    }
    .subcat-btn:hover { color: var(--text); }
    .subcat-btn.active { background: #dbeafe; color: var(--primary); border-color: #93c5fd; }
    body.dark .subcat-btn.active { background: rgba(37,99,235,.2); border-color: rgba(37,99,235,.4); }

    /* CARDS */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }
    .card {
      background: var(--surface);
      border-radius: var(--radius);
      border-top: 4px solid #6b7280;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: box-shadow .15s, transform .1s;
      position: relative;
    }
    .card:hover { box-shadow: var(--shadow-lg); transform: translateY(-1px); }
    .card.cat-medical { border-top-color: #10b981; }
    .card.cat-legal { border-top-color: #8b5cf6; }
    .card.cat-shop { border-top-color: #f59e0b; }
    .card.cat-food { border-top-color: #f43f5e; }
    .card.cat-service { border-top-color: #3b82f6; }
    .card.cat-edu { border-top-color: #06b6d4; }
    .card-body { padding: 14px 14px 10px; flex: 1; }
    .card-top { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 10px; }
    .card-icon {
      font-size: 26px;
      background: var(--surface2);
      border-radius: 10px;
      width: 48px; height: 48px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .card-meta { flex: 1; min-width: 0; }
    .card-cats {
      display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 4px; align-items: center;
    }
    .cat-chip {
      font-size: .72rem;
      background: var(--surface2);
      color: var(--text3);
      border-radius: 4px;
      padding: 1px 7px;
    }
    .card-id { font-size: .72rem; color: var(--text3); font-family: monospace; }
    .card-name { font-weight: 700; font-size: 1rem; line-height: 1.35; }
    .card-address {
      display: flex; align-items: flex-start; gap: 5px;
      font-size: .83rem; color: var(--text3); margin-top: 8px;
    }
    .card-address svg { flex-shrink: 0; margin-top: 2px; }

    /* EDIT BTN */
    .edit-btn {
      position: absolute;
      top: 8px; left: 8px;
      background: rgba(255,255,255,.85);
      border: 1px solid var(--border);
      border-radius: 6px;
      width: 30px; height: 30px;
      display: none;
      align-items: center; justify-content: center;
      cursor: pointer;
      font-size: 13px;
      color: var(--primary);
      transition: background .1s;
      z-index: 2;
    }
    body.dark .edit-btn { background: rgba(30,41,59,.9); }
    .card:hover .edit-btn.visible { display: flex; }

    /* RATINGS */
    .rating-row {
      display: flex; align-items: center; justify-content: space-between;
      margin-top: 10px;
    }
    .stars { display: flex; gap: 1px; direction: ltr; }
    .star {
      cursor: pointer;
      color: #d1d5db;
      transition: color .1s, transform .1s;
      line-height: 1;
    }
    .star.filled { color: #f59e0b; }
    .star:hover { transform: scale(1.15); color: #f59e0b; }
    .star-sm { font-size: 15px; }
    .star-md { font-size: 18px; }
    .star-lg { font-size: 20px; }
    .rating-info {
      font-size: .75rem;
      background: #fef3c7;
      color: #92400e;
      border-radius: 12px;
      padding: 2px 8px;
      font-weight: 600;
    }
    body.dark .rating-info { background: rgba(245,158,11,.15); color: #fbbf24; }

    /* MAP BUTTON */
    .map-btn {
      background: #ecfdf5;
      color: #065f46;
      border: 1px solid #a7f3d0;
      border-radius: 7px;
      padding: 5px 12px;
      font-family: 'Cairo', sans-serif;
      font-size: .8rem;
      font-weight: 600;
      cursor: pointer;
      display: flex; align-items: center; gap: 4px;
      margin-top: 8px;
      transition: background .1s;
      text-decoration: none;
      width: fit-content;
    }
    .map-btn:hover { background: #d1fae5; }
    body.dark .map-btn { background: rgba(16,185,129,.1); color: #6ee7b7; border-color: rgba(16,185,129,.3); }

    /* DETAILS TOGGLE */
    .details-toggle {
      border-top: 1px solid var(--border);
      padding: 9px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      font-size: .83rem;
      color: var(--text3);
      transition: background .1s;
    }
    .details-toggle:hover { background: var(--surface2); }
    .details-toggle .ch { font-size: 11px; transition: transform .2s; }
    .details-toggle.open .ch { transform: rotate(180deg); }
    .details-body {
      display: none;
      padding: 10px 14px 14px;
      border-top: 1px solid var(--border);
      font-size: .83rem;
      color: var(--text2);
      gap: 8px;
      flex-direction: column;
    }
    .details-body.open { display: flex; }
    .detail-row { display: flex; align-items: center; gap: 6px; }
    .detail-row a { color: var(--primary); text-decoration: none; }
    .detail-row a:hover { text-decoration: underline; }

    /* EMPTY STATE */
    .empty { text-align: center; padding: 60px 20px; color: var(--text3); font-size: .95rem; }
    .empty .icon { font-size: 48px; margin-bottom: 12px; }

    /* MODAL OVERLAY */
    .modal-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,.55);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--surface);
      border-radius: 12px;
      width: 100%;
      max-width: 480px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: var(--shadow-lg);
      padding: 24px;
    }
    .modal h2 { font-size: 1.1rem; font-weight: 800; margin-bottom: 18px; }
    .modal .form-group { margin-bottom: 12px; }
    .modal-footer { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; }
    .btn-secondary {
      background: var(--surface2);
      color: var(--text2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 18px;
      font-family: 'Cairo', sans-serif;
      font-size: .88rem;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-secondary:hover { background: var(--border); }
    .err-msg { color: #ef4444; font-size: .82rem; margin-top: 8px; }

    /* ADMIN PANEL */
    .admin-panel {
      display: none;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 20px;
      padding: 18px;
      box-shadow: var(--shadow);
    }
    .admin-panel.open { display: block; }
    .admin-panel h2 { font-size: 1rem; font-weight: 800; margin-bottom: 14px; color: var(--primary); }
    .admin-tabs { display: flex; gap: 4px; margin-bottom: 14px; }
    .admin-tab {
      padding: 6px 14px;
      border-radius: 7px;
      font-family: 'Cairo', sans-serif;
      font-size: .85rem;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text2);
    }
    .admin-tab.active { background: var(--primary); color: #fff; border-color: var(--primary); }
    .admin-content { display: none; }
    .admin-content.active { display: block; }
    .audit-table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: .82rem; }
    th, td { padding: 8px 10px; border-bottom: 1px solid var(--border); text-align: right; }
    th { font-weight: 700; color: var(--text2); background: var(--surface2); }
    .action-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: .75rem;
      font-weight: 600;
    }
    .action-create { background: #dcfce7; color: #166534; }
    .action-update { background: #dbeafe; color: #1e40af; }
    .action-delete { background: #fee2e2; color: #991b1b; }
    body.dark .action-create { background: rgba(16,185,129,.15); color: #6ee7b7; }
    body.dark .action-update { background: rgba(37,99,235,.15); color: #93c5fd; }
    body.dark .action-delete { background: rgba(239,68,68,.15); color: #fca5a5; }
    .users-list { display: flex; flex-direction: column; gap: 10px; }
    .user-row {
      background: var(--surface2);
      border-radius: 8px;
      padding: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }
    .user-info { font-size: .88rem; }
    .user-info strong { display: block; }
    .role-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: .72rem;
      font-weight: 700;
    }
    .role-admin { background: #fef9c3; color: #854d0e; }
    .role-editor { background: #dbeafe; color: #1e40af; }
    .role-viewer { background: #f3f4f6; color: #374151; }
    body.dark .role-admin { background: rgba(234,179,8,.15); color: #fde047; }
    body.dark .role-editor { background: rgba(37,99,235,.15); color: #93c5fd; }
    body.dark .role-viewer { background: rgba(107,114,128,.15); color: #9ca3af; }
    .blocked-badge { background: #fee2e2; color: #991b1b; padding: 1px 7px; border-radius: 8px; font-size: .72rem; font-weight: 700; }
    .user-actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .btn-sm {
      padding: 5px 10px;
      font-family: 'Cairo', sans-serif;
      font-size: .78rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text2);
    }
    .btn-sm:hover { background: var(--surface2); }
    .btn-sm.danger { color: var(--danger); border-color: #fca5a5; }
    .btn-sm.danger:hover { background: #fee2e2; }
    .filter-row { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
    .filter-row input, .filter-row select {
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 6px 10px;
      font-family: 'Cairo', sans-serif;
      font-size: .82rem;
      background: var(--surface);
      color: var(--text);
      outline: none;
    }
    .btn-export {
      margin-right: auto;
      padding: 6px 14px;
      font-family: 'Cairo', sans-serif;
      font-size: .82rem;
      font-weight: 600;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 7px;
      cursor: pointer;
      color: var(--text2);
    }
    .btn-export:hover { background: var(--border); }

    /* TOP RATED */
    .top-rated-wrap { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 14px; }
    .top-rated-chip {
      background: linear-gradient(135deg, #fef3c7, #fde68a);
      color: #92400e;
      border: 1px solid #fcd34d;
      border-radius: 20px;
      padding: 5px 14px;
      font-size: .82rem;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
      display: flex; align-items: center; gap: 5px;
      transition: transform .1s;
      flex-shrink: 0;
    }
    .top-rated-chip:hover { transform: translateY(-2px); }
    body.dark .top-rated-chip { background: linear-gradient(135deg, rgba(245,158,11,.2), rgba(245,158,11,.1)); color: #fbbf24; border-color: rgba(245,158,11,.3); }

    /* TOAST */
    .toast-container {
      position: fixed;
      bottom: 20px;
      right: 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 9999;
    }
    .toast {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 16px;
      font-size: .85rem;
      font-weight: 600;
      box-shadow: var(--shadow-lg);
      animation: slideIn .2s ease;
      max-width: 300px;
      display: flex; align-items: center; gap: 8px;
    }
    .toast.success { border-right: 4px solid var(--success); }
    .toast.error { border-right: 4px solid var(--danger); }
    @keyframes slideIn { from { transform: translateX(40px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

    /* UTIL */
    .divider { border: none; border-top: 1px solid var(--border); margin: 14px 0; }
    @media (max-width: 500px) {
      .header-title h1 { font-size: 1rem; }
      .header-title p { display: none; }
      .cards-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<!-- HEADER -->
<header class="header">
  <div class="header-brand">
    <div class="header-icon">📍</div>
    <div class="header-title">
      <h1>دليل مدينة حمص الخدمي والتجاري</h1>
      <p>منصة تشاركية مفتوحة — أضف طبيبك، محلّك، وخدمتك وشاركها فوراً</p>
    </div>
  </div>
  <div class="header-actions">
    <span class="badge-count" id="total-badge">0 منشأة</span>
    <button class="btn-icon" onclick="render()" title="تحديث">🔄</button>
    <button class="btn-icon" onclick="toggleDark()" id="dark-btn" title="الوضع الليلي">🌙</button>
    <button class="btn-login" id="login-btn" onclick="openLoginModal()">
      <span>🔐</span><span id="login-label">تسجيل الدخول</span>
    </button>
  </div>
</header>

<!-- MAIN -->
<div class="container">

  <!-- ADMIN PANEL -->
  <div class="admin-panel" id="admin-panel">
    <h2>🛡️ لوحة الإدارة</h2>
    <div class="admin-tabs">
      <button class="admin-tab active" onclick="switchAdminTab('audit')">سجل العمليات</button>

}

// ============================================================
// STATE
// ============================================================
let entries = [];
let users = [];
let audit = [];
let ratings = {};    // { entryId_fp: value }
let session = null;  // { id, username, role, isBlocked, dailyEditLimit }
let darkMode = false;
let selectedCat = '';
let selectedSubCat = '';
let searchQ = '';
let editingId = null;
let authMode = 'login'; // or 'register'

// ============================================================
// INIT
// ============================================================
function init() {
  entries = initEntries();
  users = initUsers();
  audit = loadJSON(STORAGE_KEYS.audit, []);
  ratings = loadJSON(STORAGE_KEYS.ratings, {});
  session = loadJSON(STORAGE_KEYS.session, null);
  darkMode = localStorage.getItem('homs_dark') === '1';
  if (darkMode) document.body.classList.add('dark');
  document.getElementById('dark-btn').textContent = darkMode ? '☀️' : '🌙';
  render();
}

function toggleDark() {
  darkMode = !darkMode;
  document.body.classList.toggle('dark', darkMode);
  document.getElementById('dark-btn').textContent = darkMode ? '☀️' : '🌙';
  localStorage.setItem('homs_dark', darkMode ? '1' : '0');
}

// ============================================================
// AUTH
// ============================================================
function openLoginModal() {
  if (session) { handleLogout(); return; }
  authMode = 'login';
  document.getElementById('modal-title').textContent = 'تسجيل الدخول';
  document.getElementById('m-submit').textContent = 'دخول';
  document.getElementById('m-switch').textContent = 'إنشاء حساب';
  document.getElementById('m-err').textContent = '';
  document.getElementById('m-username').value = '';
  document.getElementById('m-password').value = '';
  document.getElementById('login-modal').classList.add('open');
  setTimeout(() => document.getElementById('m-username').focus(), 100);
}
function closeLoginModal() { document.getElementById('login-modal').classList.remove('open'); }
function switchAuthMode() {
  authMode = authMode === 'login' ? 'register' : 'login';
  document.getElementById('modal-title').textContent = authMode === 'login' ? 'تسجيل الدخول' : 'إنشاء حساب جديد';
  document.getElementById('m-submit').textContent = authMode === 'login' ? 'دخول' : 'إنشاء الحساب';
  document.getElementById('m-switch').textContent = authMode === 'login' ? 'إنشاء حساب' : 'لديّ حساب';
  document.getElementById('m-err').textContent = '';
}

function handleLogin() {
  const username = document.getElementById('m-username').value.trim();
  const password = document.getElementById('m-password').value;
  document.getElementById('m-err').textContent = '';
  if (!username || !password) { document.getElementById('m-err').textContent = 'يرجى ملء جميع الحقول'; return; }
  if (authMode === 'login') {
    const user = users.find(u => u.username === username && u.password === password);
    if (!user) { document.getElementById('m-err').textContent = 'اسم المستخدم أو كلمة المرور غير صحيحة'; return; }
    if (user.isBlocked) { document.getElementById('m-err').textContent = 'تم إيقاف حسابك من قِبل المشرف'; return; }
    session = { id: user.id, username: user.username, role: user.role, isBlocked: user.isBlocked, dailyEditLimit: user.dailyEditLimit };
    saveJSON(STORAGE_KEYS.session, session);
    closeLoginModal();
    toast('مرحباً، ' + user.username + ' 👋', 'success');
    render();
  } else {
    if (username.length < 3) { document.getElementById('m-err').textContent = 'اسم المستخدم يجب أن يكون 3 أحرف على الأقل'; return; }
    if (password.length < 6) { document.getElementById('m-err').textContent = 'كلمة المرور يجب أن تكون 6 أحرف على الأقل'; return; }
    if (users.find(u => u.username === username)) { document.getElementById('m-err').textContent = 'اسم المستخدم موجود بالفعل'; return; }
    const newUser = { id: Date.now(), username, password, role: 'editor', isBlocked: false, dailyEditLimit: 7, createdAt: new Date().toISOString() };
    users.push(newUser);
    saveJSON(STORAGE_KEYS.users, users);
    session = { id: newUser.id, username: newUser.username, role: newUser.role, isBlocked: false, dailyEditLimit: 7 };
    saveJSON(STORAGE_KEYS.session, session);
    closeLoginModal();
    toast('تم إنشاء الحساب بنجاح! مرحباً، ' + username, 'success');
    render();
  }
}

function handleLogout() {
  session = null;
  localStorage.removeItem(STORAGE_KEYS.session);
  toast('تم تسجيل الخروج', 'success');
  render();
}

// ============================================================
// CATEGORIES & FILTERING
// ============================================================
const CAT_CONFIG = {
  'طبي / صحة':   { cls: 'cat-medical', icon: '🏥' },
  'قانوني':       { cls: 'cat-legal',   icon: '⚖️' },
  'تسوق / محلات': { cls: 'cat-shop',    icon: '🛒' },
  'مطاعم / طعام': { cls: 'cat-food',    icon: '🍽️' },
  'خدمات':        { cls: 'cat-service', icon: '🔧' },
  'تعليم':        { cls: 'cat-edu',     icon: '📚' },
};
function getCatCls(cat) { return CAT_CONFIG[cat]?.cls || ''; }
function getCatIcon(cat) { return CAT_CONFIG[cat]?.icon || '📋'; }

function getFilteredEntries() {
  return entries.filter(e => {
    if (selectedCat && e.mainCategory !== selectedCat) return false;
    if (selectedSubCat && e.subCategory !== selectedSubCat) return false;
    if (searchQ) {
      const q = searchQ.toLowerCase();
      const hay = [e.name, e.address, e.mainCategory, e.subCategory, e.notes, e.phone].filter(Boolean).join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}

function onSearch() { searchQ = document.getElementById('search-input').value.trim(); renderCards(); }

// ============================================================
// RENDER
// ============================================================
function render() {
  renderHeader();
  renderAddForm();
  renderTopRated();
  renderCategories();
  renderCards();
  renderAdminPanel();
  if (session?.role === 'admin') renderAudit(), renderUsers();
}

function renderHeader() {
  document.getElementById('total-badge').textContent = entries.length + ' منشأة';
  const lbl = document.getElementById('login-label');
  if (session) {
    lbl.textContent = session.username + ' (خروج)';
  } else {
    lbl.textContent = 'تسجيل الدخول';
  }
}

function renderAdminPanel() {
  const panel = document.getElementById('admin-panel');
  panel.classList.toggle('open', !!(session && session.role === 'admin'));
}

function renderAddForm() {
  const inner = document.getElementById('add-form-inner');

    inner.innerHTML = `<div class="not-logged-msg">لإضافة منشأة جديدة، يرجى <a onclick="openLoginModal()">تسجيل الدخول أولاً</a>.</div>`;

  }
  const cats = [...new Set(entries.map(e => e.mainCategory))];
  const subcats = selectedCat ? [...new Set(entries.filter(e => e.mainCategory === selectedCat).map(e => e.subCategory))] : [];
  inner.innerHTML = `
    <div class="form-grid">
      <div class="form-group" style="grid-column:span 2">
        <label>اسم المنشأة *</label>
        <input type="text" id="f-name" placeholder="مثال: مطعم النخيل أو دكتور سامر الأحمد">
      </div>
      <div class="form-group">
        <label>التصنيف الرئيسي *</label>
        <select id="f-maincat" onchange="renderSubCatOptions()">
          <option value="">-- اختر --</option>
          ${cats.map(c => `<option>${c}</option>`).join('')}
          <option value="__new">تصنيف جديد...</option>
        </select>
        <input type="text" id="f-maincat-new" placeholder="أدخل التصنيف الجديد" style="display:none;margin-top:6px">
      </div>
      <div class="form-group">
        <label>التصنيف الفرعي *</label>
        <select id="f-subcat">
          <option value="">-- اختر --</option>
          ${subcats.map(s => `<option>${s}</option>`).join('')}
          <option value="__new">تصنيف جديد...</option>
        </select>
        <input type="text" id="f-subcat-new" placeholder="أدخل التصنيف الفرعي" style="display:none;margin-top:6px">
      </div>
      <div class="form-group" style="grid-column:span 2">
        <label>العنوان *</label>
        <input type="text" id="f-address" placeholder="الحي، الشارع، المنطقة">
      </div>
      <div class="form-group">
        <label>رقم الهاتف</label>
        <input type="text" id="f-phone" placeholder="مثال: 031-2212345">
      </div>
      <div class="form-group">
        <label>رابط الموقع (خرائط Google)</label>
        <input type="url" id="f-map" placeholder="https://maps.google.com/...">
      </div>
      <div class="form-group">
        <label>مواعيد / ملاحظات</label>
        <textarea id="f-notes" placeholder="ساعات العمل، تخصصات، معلومات مفيدة..."></textarea>
      </div>
      <div class="form-group">
        <label>رابط التواصل الاجتماعي</label>
        <input type="url" id="f-social" placeholder="https://facebook.com/...">
      </div>
    </div>
    <button class="btn-primary" onclick="addEntry()">💾 حفظ وإدراج في الدليل العام</button>
  `;
}

function renderSubCatOptions() {
  const mainCatSel = document.getElementById('f-maincat');
  const mainCatNew = document.getElementById('f-maincat-new');
  const subCatSel = document.getElementById('f-subcat');
  if (!mainCatSel || !subCatSel) return;
  const val = mainCatSel.value;
  mainCatNew.style.display = val === '__new' ? 'block' : 'none';
  const cat = val === '__new' ? '' : val;
  const subcats = cat ? [...new Set(entries.filter(e => e.mainCategory === cat).map(e => e.subCategory))] : [];
  subCatSel.innerHTML = `<option value="">-- اختر --</option>${subcats.map(s => `<option>${s}</option>`).join('')}<option value="__new">تصنيف جديد...</option>`;
  const subNew = document.getElementById('f-subcat-new');
  if (subNew) subNew.style.display = 'none';
}

function getAddFormVal(id, newId) {
  const sel = document.getElementById(id);
  if (!sel) return '';
  if (sel.value === '__new') {
    const ni = document.getElementById(newId);
    return ni ? ni.value.trim() : '';
  }
  return sel.value.trim();
}

function addEntry() {
  if (!session) { openLoginModal(); return; }
  const name = document.getElementById('f-name')?.value.trim();
  const mainCategory = getAddFormVal('f-maincat', 'f-maincat-new');
  const subCategory = getAddFormVal('f-subcat', 'f-subcat-new');
  const address = document.getElementById('f-address')?.value.trim();
  const phone = document.getElementById('f-phone')?.value.trim() || null;
  const mapLink = document.getElementById('f-map')?.value.trim() || null;
  const notes = document.getElementById('f-notes')?.value.trim() || null;
  const social = document.getElementById('f-social')?.value.trim() || null;
  if (!name) { toast('يرجى إدخال اسم المنشأة', 'error'); return; }
  if (!mainCategory) { toast('يرجى اختيار التصنيف الرئيسي', 'error'); return; }
  if (!subCategory) { toast('يرجى اختيار التصنيف الفرعي', 'error'); return; }
  if (!address) { toast('يرجى إدخال العنوان', 'error'); return; }
  const id = entries.length > 0 ? Math.max(...entries.map(e => e.id)) + 1 : 1;
  const entry = { id, name, mainCategory, subCategory, address, phone, mapLink, notes, social, status: 'نشط', ratingAvg: null, ratingCount: 0, createdAt: new Date().toISOString() };
  entries.push(entry);
  saveJSON(STORAGE_KEYS.entries, entries);
  logAudit({ action: 'create', entryId: id, entryName: name, oldValues: null, newValues: JSON.stringify(entry) });
  toast('تمت إضافة المنشأة بنجاح ✅', 'success');
  render();
}

function renderTopRated() {
  const sorted = [...entries].filter(e => e.ratingAvg).sort((a, b) => (b.ratingAvg||0) - (a.ratingAvg||0)).slice(0, 5);
  const el = document.getElementById('top-rated-section');
  if (sorted.length === 0) { el.innerHTML = ''; return; }
  el.innerHTML = `
    <div style="font-size:.82rem;font-weight:700;color:var(--text3);margin-bottom:6px;">⭐ الأعلى تقييماً</div>
    <div class="top-rated-wrap">
      ${sorted.map(e => `
        <div class="top-rated-chip" onclick="highlightCard(${e.id})">
          ⭐ ${e.ratingAvg?.toFixed(1)} — ${e.name}
        </div>
      `).join('')}
    </div>
  `;
}

function renderCategories() {
  const cats = ['الكل', ...new Set(entries.map(e => e.mainCategory))];
  const wrap = document.getElementById('cats-wrap');
  wrap.innerHTML = cats.map(c => `
    <button class="cat-btn ${(c === 'الكل' ? !selectedCat : selectedCat === c) ? 'active' : ''}"
      onclick="selectCat('${c === 'الكل' ? '' : c}')">
      ${c === 'الكل' ? c : (getCatIcon(c) + ' ' + c)}
    </button>
  `).join('');
  const subwrap = document.getElementById('subcats-wrap');
  if (selectedCat) {
    const subcats = [...new Set(entries.filter(e => e.mainCategory === selectedCat).map(e => e.subCategory))];
    subwrap.innerHTML = subcats.map(s => `
      <button class="subcat-btn ${selectedSubCat === s ? 'active' : ''}" onclick="selectSubCat('${s}')">
        ${s}
      </button>
    `).join('');
  } else {
    subwrap.innerHTML = '';
  }
}

function selectCat(cat) { selectedCat = cat; selectedSubCat = ''; renderCategories(); renderCards(); }
function selectSubCat(sub) { selectedSubCat = selectedSubCat === sub ? '' : sub; renderCategories(); renderCards(); }

function highlightCard(id) {
  const el = document.getElementById('card-' + id);
  if (el) { el.scrollIntoView({ behavior: 'smooth', block: 'center' }); el.style.outline = '3px solid #f59e0b'; setTimeout(() => el.style.outline = '', 1500); }
}

function renderCards() {
  const filtered = getFilteredEntries();
  const grid = document.getElementById('cards-grid');
  const sc = document.getElementById('search-count');
  sc.textContent = searchQ ? `${filtered.length} نتيجة للبحث عن "${searchQ}"` : '';
  if (filtered.length === 0) {
    grid.innerHTML = `<div class="empty" style="grid-column:1/-1"><div class="icon">🔍</div><p>لا توجد نتائج مطابقة للبحث</p></div>`;
    return;
  }
  grid.innerHTML = filtered.map(e => renderCard(e)).join('');
}

function renderCard(e) {
  const fp = getFingerprint();
  const rKey = e.id + '_' + fp;
  const myRating = ratings[rKey] || 0;
  const stars = [1,2,3,4,5].map(s => {
    const sz = s <= 2 ? 'star-sm' : s === 3 ? 'star-md' : 'star-lg';
    const filled = myRating > 0 ? s <= myRating : (e.ratingAvg && s <= Math.round(e.ratingAvg));
    return `<span class="star ${sz} ${filled ? 'filled' : ''}" onclick="rateEntry(${e.id}, ${s})">★</span>`;
  }).join('');
  const canEdit = session && (session.role === 'admin' || session.role === 'editor') && !session.isBlocked;
  const editBtn = canEdit ? `<button class="edit-btn visible" onclick="openEditModal(${e.id})" title="تعديل">✏️</button>` : '';
  const mapBtn = e.mapLink ? `<a href="${e.mapLink}" target="_blank" class="map-btn">🗺️ موقع على الخريطة</a>` : '';
  const ratingInfo = e.ratingCount > 0 ? `<span class="rating-info">⭐ ${e.ratingAvg?.toFixed(1)} (${e.ratingCount})</span>` : '';
  const details = [];
  if (e.phone) details.push(`<div class="detail-row">📞 <a href="tel:${e.phone}">${e.phone}</a></div>`);
  if (e.notes) details.push(`<div class="detail-row">🕐 ${e.notes}</div>`);
  if (e.social) details.push(`<div class="detail-row">🔗 <a href="${e.social}" target="_blank">صفحة التواصل</a></div>`);
  return `
    <div class="card ${getCatCls(e.mainCategory)}" id="card-${e.id}">
      ${editBtn}
      <div class="card-body">
        <div class="card-top">
          <div class="card-icon">${getCatIcon(e.mainCategory)}</div>
          <div class="card-meta">
            <div class="card-cats">
              <span class="cat-chip">${e.mainCategory}</span>
              <span class="cat-chip">${e.subCategory}</span>
              <span class="card-id">#${e.id}</span>
            </div>
            <div class="card-name">${e.name}</div>
          </div>
        </div>
        <div class="card-address">
          <svg width="12" height="14" viewBox="0 0 12 14" fill="none"><path d="M6 0C3.24 0 1 2.19 1 4.88c0 3.65 5 9.12 5 9.12s5-5.47 5-9.12C11 2.19 8.76 0 6 0Zm0 6.63a1.75 1.75 0 1 1 0-3.5 1.75 1.75 0 0 1 0 3.5Z" fill="currentColor"/></svg>
          ${e.address}
        </div>
        ${mapBtn}
        <div class="rating-row">
          <div class="stars">${stars}</div>
          ${ratingInfo}
        </div>
      </div>
      ${details.length > 0 ? `
      <div class="details-toggle" onclick="toggleDetails(this)">
        <span>التفاصيل للتواصل</span><span class="ch">▼</span>
      </div>
      <div class="details-body">
        ${details.join('')}
      </div>` : ''}
    </div>
  `;
}

function toggleDetails(el) {
  el.classList.toggle('open');
  el.nextElementSibling.classList.toggle('open');
}

// ============================================================
// RATINGS
// ============================================================
function rateEntry(entryId, value) {
  const fp = getFingerprint();
  const rKey = entryId + '_' + fp;
  if (ratings[rKey]) { toast('لقد قيّمت هذه المنشأة مسبقاً', 'error'); return; }
  ratings[rKey] = value;
  saveJSON(STORAGE_KEYS.ratings, ratings);
  const entry = entries.find(e => e.id === entryId);
  if (entry) {
    const allRatings = Object.entries(ratings).filter(([k]) => k.startsWith(entryId + '_')).map(([,v]) => v);
    entry.ratingAvg = allRatings.reduce((a, b) => a + b, 0) / allRatings.length;
    entry.ratingCount = allRatings.length;
    saveJSON(STORAGE_KEYS.entries, entries);
  }
  toast('شكراً على تقييمك ⭐', 'success');
  renderCards();
  renderTopRated();
}

// ============================================================
// EDIT MODAL
// ============================================================
function openEditModal(id) {
  editingId = id;
  const e = entries.find(x => x.id === id);
  if (!e) return;
  const inner = document.getElementById('edit-form-inner');
  const cats = [...new Set(entries.map(e => e.mainCategory))];
  const subcats = [...new Set(entries.filter(x => x.mainCategory === e.mainCategory).map(x => x.subCategory))];
  inner.innerHTML = `
    <div class="form-group"><label>الاسم *</label><input type="text" id="e-name" value="${esc(e.name)}"></div>
    <div class="form-group">
      <label>التصنيف الرئيسي *</label>
      <select id="e-maincat">${cats.map(c => `<option ${c===e.mainCategory?'selected':''}>${c}</option>`).join('')}</select>
    </div>
    <div class="form-group">
      <label>التصنيف الفرعي *</label>
      <select id="e-subcat">${subcats.map(s => `<option ${s===e.subCategory?'selected':''}>${s}</option>`).join('')}</select>
    </div>
    <div class="form-group"><label>العنوان *</label><input type="text" id="e-address" value="${esc(e.address)}"></div>
    <div class="form-group"><label>الهاتف</label><input type="text" id="e-phone" value="${esc(e.phone||'')}"></div>
    <div class="form-group"><label>رابط الخريطة</label><input type="url" id="e-map" value="${esc(e.mapLink||'')}"></div>
    <div class="form-group"><label>ملاحظات</label><textarea id="e-notes">${esc(e.notes||'')}</textarea></div>
    <div class="form-group"><label>رابط التواصل</label><input type="url" id="e-social" value="${esc(e.social||'')}"></div>
    ${session?.role === 'admin' ? `
    <div class="form-group"><label>الحالة</label>
      <select id="e-status"><option ${e.status==='نشط'?'selected':''}>نشط</option><option ${e.status==='مغلق'?'selected':''}>مغلق</option></select>
    </div>` : ''}
  `;
  document.getElementById('edit-err').textContent = '';
  document.getElementById('edit-modal').classList.add('open');
}

function closeEditModal() { document.getElementById('edit-modal').classList.remove('open'); editingId = null; }

function saveEdit() {
  if (!editingId) return;
  if (!session) { toast('يجب تسجيل الدخول', 'error'); return; }

  // Daily edit limit check (non-admin)
  if (session.role !== 'admin') {
    const today = new Date().toDateString();
    const todayEdits = audit.filter(a => a.userId === session.id && a.action === 'update' && new Date(a.createdAt).toDateString() === today).length;
    if (todayEdits >= session.dailyEditLimit) {
      document.getElementById('edit-err').textContent = `تجاوزت الحد اليومي (${session.dailyEditLimit} تعديلات). يُعاد التعيين غداً.`;
      return;
    }
  }

  const e = entries.find(x => x.id === editingId);
  if (!e) return;
  const oldValues = JSON.stringify(e);

  const name = document.getElementById('e-name')?.value.trim();
  const mainCategory = document.getElementById('e-maincat')?.value.trim();
  const subCategory = document.getElementById('e-subcat')?.value.trim();
  const address = document.getElementById('e-address')?.value.trim();
  if (!name || !mainCategory || !subCategory || !address) {
    document.getElementById('edit-err').textContent = 'يرجى ملء جميع الحقول المطلوبة'; return;
  }

  e.name = name;
  e.mainCategory = mainCategory;
  e.subCategory = subCategory;
  e.address = address;
  e.phone = document.getElementById('e-phone')?.value.trim() || null;
  e.mapLink = document.getElementById('e-map')?.value.trim() || null;
  e.notes = document.getElementById('e-notes')?.value.trim() || null;
  e.social = document.getElementById('e-social')?.value.trim() || null;
  if (session.role === 'admin') e.status = document.getElementById('e-status')?.value || e.status;
  e.updatedAt = new Date().toISOString();

  saveJSON(STORAGE_KEYS.entries, entries);
  logAudit({ action: 'update', entryId: e.id, entryName: e.name, oldValues, newValues: JSON.stringify(e) });
  toast('تم حفظ التعديلات بنجاح ✅', 'success');
  closeEditModal();
  render();
}

// ============================================================
// ADD FORM TOGGLE
// ============================================================
function toggleAddForm() {
  const body = document.getElementById('add-form-body');
  const hdr = document.querySelector('.add-form-header');
  body.classList.toggle('open');
  hdr.classList.toggle('open');
}

// ============================================================
// AUDIT LOG
// ============================================================
function logAudit(data) {
  const fp = getFingerprint();
  audit.push({
    id: Date.now(),
    userId: session?.id || null,
    username: session?.username || 'غير معروف',
    action: data.action,
    entryId: data.entryId,
    entryName: data.entryName,
    oldValues: data.oldValues,
    newValues: data.newValues,
    deviceFingerprint: fp,
    createdAt: new Date().toISOString(),
  });
  saveJSON(STORAGE_KEYS.audit, audit);
}

function renderAudit() {
  const fUser = document.getElementById('f-user')?.value.toLowerCase() || '';
  const fAction = document.getElementById('f-action')?.value || '';
  const filtered = audit.filter(a => {
    if (fUser && !a.username.toLowerCase().includes(fUser)) return false;
    if (fAction && a.action !== fAction) return false;
    return true;
  }).slice().reverse().slice(0, 100);
  const tbody = document.getElementById('audit-tbody');
  if (!tbody) return;
  if (filtered.length === 0) { tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;color:var(--text3)">لا توجد سجلات</td></tr>'; return; }
  const LABELS = { create: 'إضافة', update: 'تعديل', delete: 'حذف' };
  tbody.innerHTML = filtered.map(a => `
    <tr>
      <td><strong>${a.username}</strong></td>
      <td><span class="action-badge action-${a.action}">${LABELS[a.action] || a.action}</span></td>
      <td>${a.entryName}</td>
      <td>${new Date(a.createdAt).toLocaleString('ar-SY')}</td>
    </tr>
  `).join('');
}

function exportCSV() {
  const rows = [['المستخدم', 'العملية', 'المنشأة', 'التاريخ', 'البصمة']];
  audit.forEach(a => rows.push([a.username, a.action, a.entryName, a.createdAt, a.deviceFingerprint || '']));
  const csv = rows.map(r => r.map(c => '"' + String(c).replace(/"/g, '""') + '"').join(',')).join('\n');
  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = 'homs-audit-' + new Date().toISOString().split('T')[0] + '.csv';
  link.click();
}

// ============================================================
// USER MANAGEMENT
// ============================================================
function renderUsers() {
  const list = document.getElementById('users-list');
  if (!list) return;
  list.innerHTML = users.map(u => `
    <div class="user-row">
      <div class="user-info">
        <strong>${u.username}</strong>
        <div style="display:flex;gap:6px;align-items:center;margin-top:3px;flex-wrap:wrap">
          <span class="role-badge role-${u.role}">${u.role === 'admin' ? '🛡️ مشرف' : u.role === 'editor' ? '✏️ محرر' : '👁️ قارئ'}</span>
          ${u.isBlocked ? '<span class="blocked-badge">🚫 موقوف</span>' : ''}
          <span style="font-size:.72rem;color:var(--text3)">حد يومي: ${u.dailyEditLimit}</span>
        </div>
      </div>
      <div class="user-actions">
        ${u.role !== 'admin' ? `
          <button class="btn-sm" onclick="toggleBlock(${u.id})">${u.isBlocked ? '✅ فتح الحساب' : '🚫 إيقاف'}</button>
          <button class="btn-sm" onclick="changeLimit(${u.id})">تعديل الحد</button>
          <button class="btn-sm" onclick="changeRole(${u.id})">تغيير الدور</button>
        ` : '<span style="font-size:.75rem;color:var(--text3)">الحساب الرئيسي</span>'}
      </div>
    </div>
  `).join('');
}

function toggleBlock(userId) {
  const u = users.find(x => x.id === userId);
  if (!u) return;
  u.isBlocked = !u.isBlocked;
  saveJSON(STORAGE_KEYS.users, users);
  toast(u.isBlocked ? `تم إيقاف ${u.username}` : `تم فتح حساب ${u.username}`, 'success');
  renderUsers();
}

function changeLimit(userId) {
  const u = users.find(x => x.id === userId);
  if (!u) return;
  const val = prompt(`الحد اليومي الحالي لـ "${u.username}": ${u.dailyEditLimit}\nأدخل الحد الجديد:`, u.dailyEditLimit);
  if (val === null) return;
  const n = parseInt(val);
  if (isNaN(n) || n < 0) { toast('قيمة غير صحيحة', 'error'); return; }
  u.dailyEditLimit = n;
  saveJSON(STORAGE_KEYS.users, users);
  toast(`تم تحديث حد ${u.username} إلى ${n} تعديل/يوم`, 'success');
  renderUsers();
}

function changeRole(userId) {
  const u = users.find(x => x.id === userId);
  if (!u) return;
  const ROLES = ['editor', 'viewer'];
  const next = ROLES[(ROLES.indexOf(u.role) + 1) % ROLES.length];
  u.role = next;
  saveJSON(STORAGE_KEYS.users, users);
  toast(`تم تغيير دور ${u.username} إلى ${next}`, 'success');
  renderUsers();
}

// ============================================================
// ADMIN TABS
// ============================================================
function switchAdminTab(tab) {
  document.querySelectorAll('.admin-tab').forEach((t, i) => t.classList.toggle('active', (i === 0) === (tab === 'audit')));
  document.getElementById('admin-audit').classList.toggle('active', tab === 'audit');
  document.getElementById('admin-users').classList.toggle('active', tab === 'users');
  if (tab === 'audit') renderAudit();
  if (tab === 'users') renderUsers();
}

// ============================================================
// TOAST
// ============================================================
function toast(msg, type = 'success') {
  const c = document.getElementById('toast-container');
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  t.textContent = msg;
  c.appendChild(t);
  setTimeout(() => t.remove(), 3200);
}

// ============================================================
// UTIL
// ============================================================
function esc(str) { return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

// Keyboard shortcuts
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeLoginModal(); closeEditModal(); }
  if ((e.ctrlKey || e.metaKey) && e.key === 'k') { e.preventDefault(); document.getElementById('search-input').focus(); }
});

// Close modals on overlay click
document.getElementById('login-modal').addEventListener('click', e => { if (e.target === e.currentTarget) closeLoginModal(); });
document.getElementById('edit-modal').addEventListener('click', e => { if (e.target === e.currentTarget) closeEditModal(); });

// Enter key in login form
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && document.getElementById('login-modal').classList.contains('open')) handleLogin();
});

// START
init();
</script>
</body>
</html>
