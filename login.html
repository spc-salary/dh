<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>تسجيل الدخول — دليل حمص</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { fontFamily: { sans: ['Cairo','sans-serif'] } } } }
  </script>
  <style>
    * { font-family: 'Cairo', sans-serif; box-sizing: border-box; }
    body { background: linear-gradient(135deg, #1e3a8a 0%, #1d4ed8 40%, #312e81 100%); min-height: 100vh; }
    .card { background: #fff; border-radius: 20px; box-shadow: 0 25px 60px rgba(0,0,0,.25); }
    .input-field {
      width: 100%; border: 1.5px solid #e2e8f0; border-radius: 12px;
      padding: 11px 14px; font-size: 14px; font-family: Cairo, sans-serif;
      outline: none; transition: border-color .2s, box-shadow .2s;
    }
    .input-field:focus { border-color: #1d4ed8; box-shadow: 0 0 0 3px rgba(29,78,216,.12); }
    .btn-primary {
      width: 100%; background: #1d4ed8; color: #fff; font-family: Cairo, sans-serif;
      font-weight: 700; font-size: 15px; padding: 12px; border-radius: 12px;
      border: none; cursor: pointer; transition: background .2s, transform .1s;
    }
    .btn-primary:hover { background: #1e40af; }
    .btn-primary:active { transform: scale(.98); }
    .btn-primary:disabled { opacity: .6; cursor: not-allowed; }
    .tab-btn { padding: 8px 20px; border-radius: 10px; font-family: Cairo, sans-serif; font-weight: 700; font-size: 13px; border: none; cursor: pointer; transition: all .2s; }
    .tab-btn.active { background: #1d4ed8; color: #fff; }
    .tab-btn:not(.active) { background: #f1f5f9; color: #64748b; }
    .tab-btn:not(.active):hover { background: #e2e8f0; }
    .error-box { background: #fef2f2; border: 1px solid #fecaca; color: #dc2626; border-radius: 10px; padding: 10px 14px; font-size: 13px; display: none; }
    .success-box { background: #f0fdf4; border: 1px solid #bbf7d0; color: #166534; border-radius: 10px; padding: 10px 14px; font-size: 13px; display: none; }
    .eye-btn { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: #94a3b8; }
    .eye-btn:hover { color: #475569; }
    .info-chip { background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.2); border-radius: 10px; padding: 8px 14px; font-size: 12px; color: #dbeafe; }
    @keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
    .fade-in { animation: fadeIn .3s ease; }
    .strength-bar { height: 4px; border-radius: 2px; transition: width .3s, background .3s; }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

<!-- شاشة التحميل -->
<div id="loading-screen" class="fixed inset-0 flex items-center justify-center z-50" style="background:linear-gradient(135deg,#1e3a8a,#1d4ed8,#312e81)">
  <div class="text-center text-white">
    <div class="w-12 h-12 border-4 border-white/30 border-t-white rounded-full animate-spin mx-auto mb-4"></div>
    <p class="font-semibold text-lg">جاري التحقق من الجلسة...</p>
  </div>
</div>

<div class="w-full max-w-md fade-in" id="main-content" style="display:none">

  <div class="text-center mb-6">
    <div class="inline-flex items-center justify-center w-16 h-16 bg-white/20 rounded-2xl mb-4 shadow-lg">
      <svg class="w-8 h-8 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M17.657 16.657L13.414 20.9a2 2 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
      </svg>
    </div>
    <h1 class="text-2xl font-bold text-white mb-1">دليل مدينة حمص</h1>
    <p class="text-blue-200 text-sm">الخدمي والتجاري</p>
  </div>

  <div class="card p-6 sm:p-8">

    <div class="flex gap-2 mb-6 bg-gray-50 rounded-xl p-1">
      <button class="tab-btn active flex-1" id="tab-login"    onclick="showTab('login')">دخول</button>
      <button class="tab-btn flex-1"        id="tab-register" onclick="showTab('register')">حساب جديد</button>
      <button class="tab-btn flex-1"        id="tab-forgot"   onclick="showTab('forgot')">استعادة</button>
    </div>

    <!-- نموذج تسجيل الدخول -->
    <div id="form-login" class="fade-in">
      <h2 class="text-lg font-bold text-gray-800 mb-5 text-center">أهلاً بعودتك 👋</h2>
      <div id="login-error" class="error-box mb-4"></div>
      <form onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-gray-600 mb-1.5">اسم المستخدم أو البريد الإلكتروني</label>
          <input id="login-username" type="text" class="input-field" placeholder="مثال: admin" required autocomplete="username" />
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-600 mb-1.5">كلمة المرور</label>
          <div class="relative">
            <input id="login-password" type="password" class="input-field" placeholder="••••••••" required autocomplete="current-password" />
            <button type="button" class="eye-btn" onclick="togglePwd('login-password', this)">
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
              </svg>
            </button>
          </div>
        </div>
        <div class="flex items-center gap-2">
          <input type="checkbox" id="remember-me" class="rounded" />
          <label for="remember-me" class="text-xs text-gray-500 cursor-pointer">تذكرني</label>
        </div>
        <button type="submit" id="login-btn" class="btn-primary mt-2">
          <span id="login-btn-txt">تسجيل الدخول</span>
        </button>
      </form>
      <p class="text-center text-xs text-gray-400 mt-4">
        ليس لديك حساب؟
        <button onclick="showTab('register')" class="text-blue-600 font-bold hover:underline">سجّل الآن</button>
      </p>
    </div>

    <!-- نموذج التسجيل -->
    <div id="form-register" class="fade-in" style="display:none">
      <h2 class="text-lg font-bold text-gray-800 mb-5 text-center">إنشاء حساب جديد ✨</h2>
      <div id="register-error"   class="error-box mb-4"></div>
      <div id="register-success" class="success-box mb-4"></div>
      <form onsubmit="handleRegister(event)" class="space-y-3.5">
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold text-gray-600 mb-1.5">الاسم الكامل *</label>
            <input id="reg-name" type="text" class="input-field" placeholder="أحمد محمد" required />
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-600 mb-1.5">اسم المستخدم *</label>
            <input id="reg-username" type="text" class="input-field" placeholder="ahmed_m" required minlength="3" />
          </div>
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-600 mb-1.5">البريد الإلكتروني (اختياري)</label>
          <input id="reg-email" type="email" class="input-field" dir="ltr" placeholder="email@example.com" />
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-600 mb-1.5">كلمة المرور * (6 أحرف على الأقل)</label>
          <div class="relative">
            <input id="reg-password" type="password" class="input-field" placeholder="••••••••" required minlength="6" oninput="checkStrength()" />
            <button type="button" class="eye-btn" onclick="togglePwd('reg-password', this)">
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
              </svg>
            </button>
          </div>
          <div class="mt-1.5 flex gap-1">
            <div id="str-1" class="strength-bar flex-1 bg-gray-200"></div>
            <div id="str-2" class="strength-bar flex-1 bg-gray-200"></div>
            <div id="str-3" class="strength-bar flex-1 bg-gray-200"></div>
            <div id="str-4" class="strength-bar flex-1 bg-gray-200"></div>
          </div>
          <p id="str-label" class="text-[10px] text-gray-400 mt-1"></p>
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-600 mb-1.5">تأكيد كلمة المرور *</label>
          <input id="reg-confirm" type="password" class="input-field" placeholder="••••••••" required />
        </div>
        <div class="bg-amber-50 border border-amber-200 rounded-xl p-3">
          <p class="text-xs font-bold text-amber-800 mb-2">🔐 سؤال الأمان (لاستعادة كلمة المرور)</p>
          <select id="reg-sec-question" class="input-field mb-2 text-xs" style="font-size:12px">
            <option value="city">ما اسم مدينة مولدك؟</option>
            <option value="school">ما اسم مدرستك الابتدائية؟</option>
            <option value="pet">ما اسم حيوانك الأليف الأول؟</option>
            <option value="mother">ما اسم والدتك قبل الزواج؟</option>
            <option value="friend">ما اسم صديقك المفضل في الطفولة؟</option>
          </select>
          <input id="reg-sec-answer" type="text" class="input-field" placeholder="الإجابة..." required />
        </div>
        <button type="submit" id="reg-btn" class="btn-primary">
          <span id="reg-btn-txt">إنشاء الحساب</span>
        </button>
      </form>
    </div>

    <!-- نموذج استعادة كلمة المرور -->
    <div id="form-forgot" class="fade-in" style="display:none">
      <h2 class="text-lg font-bold text-gray-800 mb-2 text-center">استعادة كلمة المرور 🔑</h2>
      <p class="text-xs text-gray-400 text-center mb-5">أدخل اسم المستخدم وأجب على سؤال الأمان</p>
      <div id="forgot-error"   class="error-box mb-4"></div>
      <div id="forgot-success" class="success-box mb-4"></div>
      <form onsubmit="handleForgot(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-gray-600 mb-1.5">اسم المستخدم</label>
          <input id="forgot-username" type="text" class="input-field" placeholder="اسم المستخدم" required oninput="loadSecurityQuestion()" />
        </div>
        <div id="forgot-question-wrap" style="display:none">
          <p id="forgot-question-text" class="text-xs font-bold text-gray-600 mb-1.5"></p>
          <input id="forgot-answer" type="text" class="input-field" placeholder="الإجابة..." />
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-600 mb-1.5">كلمة المرور الجديدة</label>
          <div class="relative">
            <input id="forgot-newpwd" type="password" class="input-field" placeholder="••••••••" required minlength="6" />
            <button type="button" class="eye-btn" onclick="togglePwd('forgot-newpwd', this)">
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
              </svg>
            </button>
          </div>
        </div>
        <button type="submit" id="forgot-btn" class="btn-primary">
          <span id="forgot-btn-txt">تعيين كلمة مرور جديدة</span>
        </button>
      </form>
    </div>

  </div>

  <div class="mt-5 info-chip text-center">
    🔐 الدخول الافتراضي للمدير: <strong>admin</strong> / <strong>Admin@2026</strong>
  </div>

</div>

<script src="js/auth.js"></script>
<script src="js/logger.js"></script>
<script>
'use strict';

// ── التحقق من الجلسة عند التحميل ─────────────────────────────
function showLoginForm() {
  document.getElementById('loading-screen').style.display = 'none';
  document.getElementById('main-content').style.display = '';
}

// أمان: إظهار النموذج بعد 3 ثوانٍ على أقصى تقدير
var safetyTimer = setTimeout(showLoginForm, 3000);

window.addEventListener('DOMContentLoaded', async () => {
  try {
    // انتظر حتى يتهيأ auth.js وينتهي initDefaultAdmin
    await new Promise(r => setTimeout(r, 400));
    const user = Auth.getCurrentUser();
    if (user) {
      clearTimeout(safetyTimer);
      window.location.replace(user.role === 'admin' ? '/admin.html' : '/app.html');
      return;
    }
  } catch (e) {
    console.warn('Auth check failed:', e);
  }
  clearTimeout(safetyTimer);
  showLoginForm();
});

function showTab(tab) {
  ['login','register','forgot'].forEach(t => {
    document.getElementById('form-' + t).style.display  = t === tab ? '' : 'none';
    document.getElementById('tab-'  + t).className =
      'tab-btn flex-1' + (t === tab ? ' active' : '');
  });
  clearMessages();
}

function clearMessages() {
  ['login-error','register-error','register-success','forgot-error','forgot-success']
    .forEach(id => {
      const el = document.getElementById(id);
      if (el) { el.style.display = 'none'; el.textContent = ''; }
    });
}

function showMsg(id, msg) {
  const el = document.getElementById(id);
  if (!el) return;
  el.textContent = msg;
  el.style.display = '';
}

function togglePwd(inputId, btn) {
  const input = document.getElementById(inputId);
  if (input.type === 'password') {
    input.type = 'text'; btn.style.color = '#1d4ed8';
  } else {
    input.type = 'password'; btn.style.color = '#94a3b8';
  }
}

function checkStrength() {
  const pwd = document.getElementById('reg-password').value;
  const bars = [1,2,3,4].map(i => document.getElementById('str-' + i));
  const label = document.getElementById('str-label');
  let score = 0;
  if (pwd.length >= 6) score++;
  if (pwd.length >= 10) score++;
  if (/[A-Z]/.test(pwd) && /[a-z]/.test(pwd)) score++;
  if (/\d/.test(pwd) && /[^A-Za-z\d]/.test(pwd)) score++;
  const colors = ['#ef4444','#f97316','#eab308','#22c55e'];
  const labels = ['ضعيفة','متوسطة','جيدة','قوية جداً'];
  bars.forEach((b, i) => {
    b.style.background = i < score ? colors[score - 1] : '#e5e7eb';
  });
  label.textContent = pwd.length ? labels[score - 1] || '' : '';
  label.style.color = score > 0 ? colors[score - 1] : '#9ca3af';
}

async function handleLogin(e) {
  e.preventDefault();
  const btn = document.getElementById('login-btn');
  const txt = document.getElementById('login-btn-txt');
  btn.disabled = true; txt.textContent = 'جاري التحقق...';
  clearMessages();

  const username = document.getElementById('login-username').value.trim();
  const password = document.getElementById('login-password').value;

  try {
    const result = await Auth.login(username, password);
    if (result.ok) {
      Logger.log('LOGIN', 'دخل المستخدم: ' + username);
      window.location.replace(result.user.role === 'admin' ? '/admin.html' : '/app.html');
    } else {
      Logger.log('LOGIN_FAIL', 'فشل دخول: ' + username);
      showMsg('login-error', result.error);
      btn.disabled = false; txt.textContent = 'تسجيل الدخول';
    }
  } catch (err) {
    showMsg('login-error', 'حدث خطأ، حاول مرة أخرى');
    btn.disabled = false; txt.textContent = 'تسجيل الدخول';
  }
}

async function handleRegister(e) {
  e.preventDefault();
  const btn = document.getElementById('reg-btn');
  const txt = document.getElementById('reg-btn-txt');
  btn.disabled = true; txt.textContent = 'جاري الإنشاء...';
  clearMessages();

  const password = document.getElementById('reg-password').value;
  const confirm  = document.getElementById('reg-confirm').value;
  if (password !== confirm) {
    showMsg('register-error', 'كلمة المرور وتأكيدها غير متطابقتين');
    btn.disabled = false; txt.textContent = 'إنشاء الحساب';
    return;
  }

  try {
    const secAnswer = document.getElementById('reg-sec-answer').value.trim();
    const hashedAns = secAnswer ? await Auth.hashPassword(secAnswer.toLowerCase()) : '';

    const result = await Auth.register({
      username:         document.getElementById('reg-username').value.trim(),
      name:             document.getElementById('reg-name').value.trim(),
      email:            document.getElementById('reg-email').value.trim(),
      password,
      securityQuestion: document.getElementById('reg-sec-question').value,
      securityAnswer:   hashedAns,
    });

    if (result.ok) {
      Logger.log('REGISTER', 'حساب جديد: ' + result.user.username);
      showMsg('register-success', '✅ تم إنشاء حسابك بنجاح! يمكنك تسجيل الدخول الآن.');
      document.getElementById('form-register').querySelector('form').reset();
      setTimeout(() => showTab('login'), 2500);
    } else {
      showMsg('register-error', result.error);
    }
  } catch (err) {
    showMsg('register-error', 'حدث خطأ، حاول مرة أخرى');
  }
  btn.disabled = false; txt.textContent = 'إنشاء الحساب';
}

const SEC_QUESTIONS = {
  city:   'ما اسم مدينة مولدك؟',
  school: 'ما اسم مدرستك الابتدائية؟',
  pet:    'ما اسم حيوانك الأليف الأول؟',
  mother: 'ما اسم والدتك قبل الزواج؟',
  friend: 'ما اسم صديقك المفضل في الطفولة؟',
};

function loadSecurityQuestion() {
  const username = document.getElementById('forgot-username').value.trim();
  const wrap = document.getElementById('forgot-question-wrap');
  if (!username) { wrap.style.display = 'none'; return; }
  try {
    const users = JSON.parse(localStorage.getItem('homs_users') || '[]');
    const user  = users.find(u => u.username === username);
    if (user && user.securityQuestion) {
      document.getElementById('forgot-question-text').textContent =
        SEC_QUESTIONS[user.securityQuestion] || user.securityQuestion;
      wrap.style.display = '';
    } else { wrap.style.display = 'none'; }
  } catch { wrap.style.display = 'none'; }
}

async function handleForgot(e) {
  e.preventDefault();
  const btn = document.getElementById('forgot-btn');
  const txt = document.getElementById('forgot-btn-txt');
  btn.disabled = true; txt.textContent = 'جاري المعالجة...';
  clearMessages();

  try {
    const username = document.getElementById('forgot-username').value.trim();
    const answer   = document.getElementById('forgot-answer').value.trim();
    const newPwd   = document.getElementById('forgot-newpwd').value;
    const result   = await Auth.resetPasswordBySecurity(username, answer, newPwd);

    if (result.ok) {
      Logger.log('PASSWORD_RESET', 'إعادة تعيين: ' + username);
      showMsg('forgot-success', '✅ تم تغيير كلمة المرور! يمكنك تسجيل الدخول الآن.');
      document.getElementById('form-forgot').querySelector('form').reset();
      document.getElementById('forgot-question-wrap').style.display = 'none';
      setTimeout(() => showTab('login'), 2500);
    } else {
      showMsg('forgot-error', result.error);
    }
  } catch (err) {
    showMsg('forgot-error', 'حدث خطأ، حاول مرة أخرى');
  }
  btn.disabled = false; txt.textContent = 'تعيين كلمة مرور جديدة';
}
</script>
</body>
</html>
